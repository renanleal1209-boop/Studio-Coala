  try{const r=localStorage.getItem('ag9-dem');if(r)DEM.tasks=JSON.parse(r);}catch(e){}
  calLoad();
}

function demMemberColor(type){return type==='sm'?'#3730a3':type==='des'?'#065f46':'#9d174d';}
function demAllMembers(){
  const out=[];
  (S.sm||[]).forEach(m=>out.push({type:'sm',id:m.id,name:m.name,role:'Social media'}));
  (S.des||[]).forEach(m=>out.push({type:'des',id:m.id,name:m.name,role:'Designer'}));
  (S.vm||[]).forEach(m=>out.push({type:'vm',id:m.id,name:m.name,role:'Videomaker'}));
  return out;
}
function demGetMember(type,id){
  const arr=type==='sm'?S.sm:type==='des'?S.des:S.vm;
  return(arr||[]).find(x=>x.id===id);
}
function demDL(dl){
  if(!dl)return{cls:'',txt:''};
  const diff=(new Date(dl)-new Date())/86400000;
  const txt=new Date(dl+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  return diff<0?{cls:'over',txt}:diff<4?{cls:'soon',txt}:{cls:'normal',txt};
}

function renderDem(){
  const root=document.getElementById('dem-root');if(!root)return;
  if(CAL.subTab==='diarias'){demShowCalendar();return;}
  if(!DEM.profile){demShowProfileScreen();return;}
  demShowBoard();
}

function demShowProfileScreen(){
  const root=document.getElementById('dem-root');
  const members=demAllMembers();
  const pcards=members.map(m=>`
    <div class="dem-pcard" onclick="demSelectProfile('${m.type}',${m.id})">
      <div class="dem-pcard-av" style="background:${demMemberColor(m.type)}">${INI(m.name)}</div>
      <div class="dem-pcard-name">${ESC(m.name)}</div>
      <div class="dem-pcard-role">${ESC(m.role)}</div>
    </div>`).join('');
  root.innerHTML=`<div style="display:flex;flex-direction:column;height:100%">${demSubTabBar()}<div class="dem-profile-screen">
      <div class="dem-profile-box">
        <h2>Quem é você?</h2>
        <p>Selecione seu perfil para ver as demandas atribuídas a você.</p>
        <div class="dem-profile-grid">
          ${pcards}
          <div class="dem-pcard admin" onclick="demSelectAdmin()">
            <div class="dem-pcard-av" style="background:#1c1c1a"><i class="ti ti-shield" style="font-size:20px"></i></div>
            <div class="dem-pcard-name">Administrador</div>
            <div class="dem-pcard-role">Ver todas as demandas</div>
          </div>
        </div>
        ${!members.length?'<p style="font-size:12px;color:var(--text3)">Nenhum membro cadastrado ainda. Adicione na aba Equipe.</p>':''}
      </div>
    </div>`;
}

function demSelectProfile(type,id){
  const m=demGetMember(type,id);if(!m)return;
  DEM.profile={type,id,name:m.name,role:type==='sm'?'Social media':type==='des'?'Designer':'Videomaker',color:demMemberColor(type)};
  DEM.filter='dall';
  demShowBoard();
}
function demSelectAdmin(){
  DEM.profile={type:'admin',name:'Administrador',role:'Visão geral',color:'#1c1c1a'};
  DEM.filter='dall';
  demShowBoard();
}
function demSwitchProfile(){DEM.profile=null;renderDem();}

function demShowBoard(){
  const root=document.getElementById('dem-root');if(!root)return;
  const p=DEM.profile;
  const isAdmin=p&&p.type==='admin';

  // filter by profile AND category
  const matchProfile=t=>{
    if(isAdmin)return true;
    return(t.assignees||[]).some(a=>a.type===p.type&&a.id===p.id);
  };
  const visibleTasks=col=>DEM.tasks.filter(t=>t.col===col&&matchProfile(t)&&(DEM.filter==='dall'||t.cat===DEM.filter));

  const catPills=Object.entries(DEM_CATS).map(([k,v])=>
    `<button class="dem-cpill${DEM.filter===k?' on '+k:''}" onclick="demSetCat('${k}')"><i class="ti ${v.icon}" style="font-size:11px"></i> ${v.label}</button>`
  ).join('');

  const myTasks=isAdmin?DEM.tasks:DEM.tasks.filter(t=>(t.assignees||[]).some(a=>a.type===p.type&&a.id===p.id));

  root.innerHTML=`
    <div class="dem-profile-bar">
      <div class="dem-profile-bar-av" style="background:${p.color}">${p.type==='admin'?'<i class="ti ti-shield" style="font-size:11px"></i>':INI(p.name)}</div>
      <div>
        <div class="dem-profile-bar-name">${ESC(p.name)}</div>
        <div class="dem-profile-bar-role">${ESC(p.role)}</div>
      </div>
      <span class="dem-view-badge">${isAdmin?'Todas as demandas':`${myTasks.length} demanda${myTasks.length!==1?'s':''} atribuída${myTasks.length!==1?'s':''}`}</span>
      <button class="dem-profile-bar-switch" onclick="demSwitchProfile()"><i class="ti ti-switch-horizontal" style="font-size:11px"></i> Trocar perfil</button>
      ${isAdmin?`<button class="btn-new" onclick="demOpenModal()" style="margin-left:.5rem"><i class="ti ti-plus"></i> Nova demanda</button>`:''}
    </div>
    <div class="dem-toolbar">
      <div class="dem-cats">
        <button class="dem-cpill${DEM.filter==='dall'?' on dall':''}" onclick="demSetCat('dall')"><i class="ti ti-layout-grid" style="font-size:11px"></i> Todas</button>
        ${catPills}
      </div>
      <div class="dem-stats">
        <span class="dem-stat do"><i class="ti ti-player-play" style="font-size:10px"></i>${myTasks.filter(t=>t.col==='do').length} fazendo</span>
        <span class="dem-stat late"><i class="ti ti-alarm" style="font-size:10px"></i>${myTasks.filter(t=>t.col==='late').length} atrasada${myTasks.filter(t=>t.col==='late').length!==1?'s':''}</span>
        <span class="dem-stat done"><i class="ti ti-circle-check" style="font-size:10px"></i>${myTasks.filter(t=>t.col==='done').length} entregue${myTasks.filter(t=>t.col==='done').length!==1?'s':''}</span>
      </div>
    </div>
    <div class="dem-board">
      ${['do','late','done'].map(col=>{
        const list=visibleTasks(col);
        const icons={do:'ti-player-play',late:'ti-alarm',done:'ti-circle-check'};
        const empties={do:'Nada por aqui 👍',late:'Nenhuma atrasada 🎉',done:'Nenhuma entregue ainda'};
        return `<div class="dem-col" ondragover="${isAdmin?`demDragOver(event,'${col}')`:'event.preventDefault()'}" ondrop="${isAdmin?`demDrop(event,'${col}')`:'void(0)'}" ondragleave="demDragLeave(event)">
          <div class="dem-col-stripe ${col}"></div>
          <div class="dem-col-hdr">
            <div class="dem-col-dot ${col}"></div>
            <span class="dem-col-title">${DEM_COLS[col]}</span>
            <span class="dem-col-cnt ${col}">${list.length}</span>
          </div>
          <div class="dem-body" id="dem-body-${col}">
            ${list.length?list.map(t=>demBuildCard(t,isAdmin)).join(''):`<div class="dem-empty"><i class="ti ${icons[col]}"></i>${empties[col]}</div>`}
          </div>
          ${isAdmin?`<button class="dem-add" onclick="demOpenModal('${col}')"><i class="ti ti-plus" style="font-size:12px"></i> Adicionar</button>`:''}
        </div>`;
      }).join('')}
    </div>`;

  if(isAdmin){
    root.querySelectorAll('.tcard').forEach(el=>{
      el.addEventListener('dragstart',e=>demDragStart(e,+el.dataset.id));
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    });
  }
}

function demBuildCard(t,isAdmin=true){
  const cat=DEM_CATS[t.cat]||{};const pri=DEM_PRIS[t.pri]||{};const dl=demDL(t.deadline);
  const assigneesHtml=(t.assignees||[]).map(a=>{
    const m=demGetMember(a.type,a.id);if(!m)return'';
    return`<span class="tc-assignee" title="${ESC(m.name)}">
      <span class="tc-av" style="background:${demMemberColor(a.type)}">${INI(m.name)}</span>${ESC(m.name.split(' ')[0])}
    </span>`;
  }).join('');
  const moveOther=Object.keys(DEM_COLS).filter(c=>c!==t.col).map(c=>{
    const i={do:'ti-player-play',late:'ti-alarm',done:'ti-circle-check'};
    return`<button class="tc-act ${c}" onclick="demMove(${t.id},'${c}')" title="${DEM_COLS[c]}"><i class="ti ${i[c]}" style="font-size:10px"></i> ${DEM_COLS[c]}</button>`;
  }).join('');
  return`<div class="tcard" draggable="true" data-id="${t.id}">
    <div class="tc-top">
      <div class="tc-title">${ESC(t.title)}</div>
      ${isAdmin?`<button class="tc-edit" onclick="demOpenModal(null,${t.id})" title="Editar"><i class="ti ti-pencil"></i></button>`:''}
    </div>
    <div class="tc-tags">
      <span class="tc-cat ${t.cat}"><i class="ti ${cat.icon||''}" style="font-size:9px"></i> ${cat.label||t.cat}</span>
      <span class="tc-pri ${t.pri}">${pri.label||t.pri}</span>
    </div>
    ${t.desc?`<div class="tc-desc">${ESC(t.desc)}</div>`:''}
    <div class="tc-footer">
      ${assigneesHtml}
      ${dl.txt?`<span class="tc-dl ${dl.cls}"><i class="ti ti-calendar" style="font-size:9px"></i> ${dl.txt}</span>`:''}
    </div>
    ${isAdmin?`<div class="tc-actions">
      ${moveOther}
      <button class="tc-act tdel" onclick="demDel(${t.id})" title="Excluir"><i class="ti ti-trash" style="font-size:10px"></i></button>
    </div>`:''}
  </div>`;
}

function demSetCat(cat){DEM.filter=cat;renderDem();}
function demSetSubTab(t){CAL.subTab=t;renderDem();}
function demSubTabBar(){
  return `<div class="dem-subtabs">
    <button class="dem-subtab${CAL.subTab==='kanban'?' active':''}" onclick="demSetSubTab('kanban')"><i class="ti ti-layout-kanban" style="font-size:13px"></i> Demandas</button>
    <button class="dem-subtab${CAL.subTab==='diarias'?' active':''}" onclick="demSetSubTab('diarias')"><i class="ti ti-calendar" style="font-size:13px"></i> Diárias</button>
  </div>`;
}
function demMove(id,col){const t=DEM.tasks.find(x=>x.id===id);if(t){t.col=col;demSave();renderDem();}}
function demDel(id){if(!confirm('Excluir esta demanda?'))return;DEM.tasks=DEM.tasks.filter(x=>x.id!==id);demSave();renderDem();}

let demDragId=null;
function demDragStart(e,id){demDragId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>{const el=document.querySelector(`.tcard[data-id="${id}"]`);if(el)el.classList.add('dragging');},0);}
function demDragOver(e,col){e.preventDefault();e.dataTransfer.dropEffect='move';const el=document.getElementById('dem-body-'+col);if(el)el.classList.add('drag-over');}
function demDragLeave(e){document.querySelectorAll('.dem-body').forEach(el=>el.classList.remove('drag-over'));}
function demDrop(e,col){e.preventDefault();document.querySelectorAll('.dem-body').forEach(el=>el.classList.remove('drag-over'));if(demDragId!==null){demMove(demDragId,col);demDragId=null;}}

function demOpenModal(defaultCol,editId){
  DEM.editId=editId||null;
  const existing=editId!=null?DEM.tasks.find(x=>x.id===editId):null;
  const col=existing?.col||defaultCol||'do';
  const members=demAllMembers();
  const selA=new Set((existing?.assignees||[]).map(a=>`${a.type}-${a.id}`));

  const membersHtml=members.length
    ?members.map(m=>{const key=`${m.type}-${m.id}`;const col=demMemberColor(m.type);
      return`<div class="dem-aopt${selA.has(key)?' on':''}" data-key="${key}" onclick="this.classList.toggle('on')">
        <span class="dem-aopt-av" style="background:${col}">${INI(m.name)}</span>
        ${ESC(m.name.split(' ')[0])} <span style="font-size:9px;opacity:.6">${m.role}</span>
      </div>`;}).join('')
    :`<span style="font-size:12px;color:var(--text3)">Adicione membros na aba Equipe.</span>`;

  const catOpts=Object.entries(DEM_CATS).map(([k,v])=>
    `<div class="dem-copt${existing?.cat===k?' on '+k:''}" data-cat="${k}" onclick="demToggleCat(this,'${k}')">
      <i class="ti ${v.icon}" style="font-size:12px"></i> ${v.label}
    </div>`).join('');

  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" id="ov">
      <div class="modal">
        <div class="modal-title">${existing?'Editar demanda':'Nova demanda'}</div>
        <div class="field"><label>Título</label>
          <input id="dm-title" type="text" placeholder="Descreva a demanda..." value="${ESC(existing?.title||'')}" />
        </div>
        <div class="field"><label>Categoria</label><div class="dem-cat-sel">${catOpts}</div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div class="field" style="margin:0"><label>Prioridade</label>
            <select id="dm-pri">
              <option value="hi"${existing?.pri==='hi'?' selected':''}>🔴 Urgente</option>
              <option value="md"${!existing||existing?.pri==='md'?' selected':''}>🟡 Média</option>
              <option value="lo"${existing?.pri==='lo'?' selected':''}>🟢 Baixa</option>
            </select>
          </div>
          <div class="field" style="margin:0"><label>Status</label>
            <select id="dm-col">
              <option value="do"${col==='do'?' selected':''}>⚡ Fazendo</option>
              <option value="late"${col==='late'?' selected':''}>⏰ Atrasada</option>
              <option value="done"${col==='done'?' selected':''}>✅ Entregue</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Prazo</label><input id="dm-dl" type="date" value="${existing?.deadline||''}" /></div>
        <div class="field"><label>Responsáveis</label><div class="dem-asgn" id="dem-asgn">${membersHtml}</div></div>
        <div class="field"><label>Descrição / notas</label>
          <textarea id="dm-desc" placeholder="Referências, links, detalhes...">${ESC(existing?.desc||'')}</textarea>
        </div>
        <div class="modal-actions">
          ${existing?`<button class="btn-g" onclick="demDel(${existing.id});closeM()" style="margin-right:auto;color:#991b1b;border-color:#fecaca"><i class="ti ti-trash" style="font-size:13px"></i> Excluir</button>`:''}
          <button class="btn-g" onclick="closeM()">Cancelar</button>
          <button class="btn-p" onclick="demSaveTask()">Salvar</button>
        </div>
      </div>
    </div>`;

  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM();});
  document.getElementById('dm-title').focus();
}

function demToggleCat(el,cat){
  document.querySelectorAll('.dem-copt').forEach(x=>x.className='dem-copt');
  el.className=`dem-copt on ${cat}`;
}

function demSaveTask(){
  const title=document.getElementById('dm-title').value.trim();
  if(!title){document.getElementById('dm-title').focus();return;}
  const catEl=document.querySelector('.dem-copt.on');const cat=catEl?catEl.dataset.cat:'arte';
  const pri=document.getElementById('dm-pri').value;
  const col=document.getElementById('dm-col').value;
  const deadline=document.getElementById('dm-dl').value;
  const desc=document.getElementById('dm-desc').value.trim();
  const assignees=[];
  document.querySelectorAll('#dem-asgn .dem-aopt.on').forEach(el=>{
    const[type,idStr]=el.dataset.key.split('-');assignees.push({type,id:+idStr});
  });
  if(DEM.editId!=null){
    const t=DEM.tasks.find(x=>x.id===DEM.editId);
    if(t)Object.assign(t,{title,cat,pri,col,deadline,desc,assignees});
  }else{
    const nid=DEM.tasks.length?Math.max(...DEM.tasks.map(x=>x.id))+1:1;
    DEM.tasks.push({id:nid,title,cat,pri,col,deadline,desc,assignees});
  }
  demSave();closeM();renderDem();
}

/* ═══════════════════════════════════
   DIÁRIAS — CALENDAR v2
═══════════════════════════════════ */
const MONTHS_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DTYPE={
  film:{label:'Filmagem',  icon:'ti-video',   col:'#be185d',bg:'#fdf2f8'},
  foto:{label:'Fotografia',icon:'ti-camera',  col:'#2563eb',bg:'#eff6ff'},
  visit:{label:'Visita',   icon:'ti-walk',    col:'#059669',bg:'#f0fdf4'},
};

// Selected day key for sidebar
let _calSelectedDay=null;
// Temp links buffer in add modal
let _calTmpLinks=[];

/* ── render ── */
function demShowCalendar(){
  const root=document.getElementById('dem-root');
  if(!root)return;
  const {year,month}=CAL;
  const today=new Date();
  const todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const firstWeekday=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  const totalCells=Math.ceil((firstWeekday+daysInMonth)/7)*7;

  let cells='';
  for(let i=0;i<totalCells;i++){
    let d,mo=month,yr=year,other=false;
    if(i<firstWeekday){d=daysInPrev-(firstWeekday-1-i);mo=month-1;if(mo<0){mo=11;yr=year-1;}other=true;}
    else if(i>=firstWeekday+daysInMonth){d=i-firstWeekday-daysInMonth+1;mo=month+1;if(mo>11){mo=0;yr=year+1;}other=true;}
    else{d=i-firstWeekday+1;}
    const dk=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dk===todayKey;
    const isSel=dk===_calSelectedDay;
    const evts=CAL.diarias.filter(e=>e.date===dk);
    const maxShow=3;
    const evtHtml=evts.slice(0,maxShow).map(e=>{
      const dt=DTYPE[e.type]||DTYPE.visit;
      const avs=(e.assignees||[]).slice(0,3).map(a=>{
        const m=demGetMember(a.type,a.id);
        return m?`<span class="cal-event-av" style="background:${demMemberColor(a.type)}">${INI(m.name)}</span>`:'';
      }).join('');
      return`<div class="cal-event" style="background:${dt.bg};color:${dt.col}" onclick="event.stopPropagation();calSelectDay('${dk}')" title="${ESC(e.client||dt.label)}">
        <div class="cal-event-dot" style="background:${dt.col}"></div>
        <span class="cal-event-label">${ESC(e.client||dt.label)}</span>
        ${avs?`<span class="cal-event-avs">${avs}</span>`:''}
      </div>`;
    }).join('');
    const moreHtml=evts.length>maxShow?`<div class="cal-more" onclick="event.stopPropagation();calSelectDay('${dk}')">+${evts.length-maxShow} mais</div>`:'';
    cells+=`<div class="cal-day${other?' other-month':''}${isToday?' today':''}${isSel?' selected':''}" onclick="calSelectDay('${dk}')">
      <div class="cal-day-num">${d}</div>
      ${evtHtml}${moreHtml}
      <button class="cal-day-add-btn" onclick="event.stopPropagation();calOpenAdd('${dk}')" title="Adicionar diária">+</button>
    </div>`;
  }

  const sidebarHtml=_calSelectedDay?calBuildSidebar():'';

  root.innerHTML=`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">${demSubTabBar()}
    <div class="cal-layout">
      <div class="cal-main">
        <div class="cal-header">
          <button class="cal-nav" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
          <button class="cal-nav" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
          <div class="cal-month-title">${MONTHS_PT[month]} ${year}</div>
          <button class="cal-today-btn" onclick="calGoToday()">Hoje</button>
        </div>
        ${calBuildWeekStrip()}
        <div class="cal-scroll">
          <div class="cal-grid-wrap">
            <div class="cal-dow-row">${DAYS_PT.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
            <div class="cal-days">${cells}</div>
          </div>
        </div>
      </div>
      <div class="cal-sidebar${_calSelectedDay?'':' closed'}" id="cal-sb">${sidebarHtml}</div>
    </div>
  </div>`;
}

function calBuildSidebar(){
  if(!_calSelectedDay)return'';
  const dk=_calSelectedDay;
  const [yr,mo,dy]=dk.split('-').map(Number);
  const dateStr=new Date(yr,mo-1,dy).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const CAP=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const evts=CAL.diarias.filter(e=>e.date===dk);

  const evtCards=evts.map(e=>{
    const dt=DTYPE[e.type]||DTYPE.visit;
    const avs=(e.assignees||[]).map(a=>{
      const m=demGetMember(a.type,a.id);
      return m?`<div class="di-av-chip"><span class="di-av" style="background:${demMemberColor(a.type)}">${INI(m.name)}</span>${ESC(m.name.split(' ')[0])}</div>`:'';
    }).join('');
    const files=(e.files||[]).map(f=>`<div class="di-att-row">
      <i class="ti ti-file-text"></i>
      <span class="di-att-name" title="${ESC(f.name)}">${ESC(f.name)}</span>
      <button class="di-att-del" onclick="calDelFile('${e.id}','${f.id}')" title="Remover"><i class="ti ti-x" style="font-size:11px"></i></button>
      <button class="ibtn" style="width:20px;height:20px;font-size:12px" onclick="calDlFile('${e.id}','${f.id}')" title="Baixar"><i class="ti ti-download"></i></button>
    </div>`).join('');
    const links=(e.links||[]).map(l=>`<div class="di-att-row">
      <i class="ti ti-link"></i>
      <a class="di-att-link" href="${ESC(l.url)}" target="_blank" title="${ESC(l.url)}">${ESC(l.url)}</a>
      <button class="di-att-del" onclick="calDelLink('${e.id}','${l.id}')" title="Remover"><i class="ti ti-x" style="font-size:11px"></i></button>
    </div>`).join('');
    return`<div class="di-card">
      <div class="di-card-top">
        <div class="di-type-bar" style="background:${dt.col}"></div>
        <div class="di-card-info">
          <div class="di-type-tag ${e.type}"><i class="ti ${dt.icon}" style="font-size:10px"></i> ${dt.label}</div>
          <div class="di-client">${ESC(e.client||'—')}</div>
          ${e.local?`<div class="di-meta-row"><i class="ti ti-map-pin"></i>${ESC(e.local)}</div>`:''}
          ${e.notes?`<div class="di-notes-txt">${ESC(e.notes)}</div>`:''}

/* ── week strip ── */
function calGetWeekDays(){
  // Get Mon-Fri of (today + weekOffset weeks)
  const today=new Date();
  const dow=today.getDay(); // 0=Sun
  const mondayOffset=dow===0?-6:1-dow; // days to Monday
  const monday=new Date(today);
  monday.setDate(today.getDate()+mondayOffset+(CAL.weekOffset*7));
  const days=[];
  for(let i=0;i<5;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    days.push(d);
  }
  return days;
}

function calBuildWeekStrip(){
  const days=calGetWeekDays();
  const today=new Date();
  const todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const WDAYS=['Seg','Ter','Qua','Qui','Sex'];

  // Week label
  const first=days[0],last=days[4];
  const weekLabel=first.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})
    +' – '+last.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'});

  const dayCols=days.map((d,i)=>{
    const dk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isToday=dk===todayKey;
    const isSel=dk===_calSelectedDay;
    const evts=CAL.diarias.filter(e=>e.date===dk);
    const maxShow=3;
    const evtHtml=evts.slice(0,maxShow).map(e=>{
      const dt=DTYPE[e.type]||DTYPE.visit;
      const avs=(e.assignees||[]).slice(0,3).map(a=>{
        const m=demGetMember(a.type,a.id);
        return m?`<span class="cal-wk-av" style="background:${demMemberColor(a.type)}">${INI(m.name)}</span>`:'';
      }).join('');
      return`<div class="cal-wk-evt" style="background:${dt.bg};color:${dt.col}" title="${ESC(e.client||dt.label)}">
        <div class="cal-wk-evt-dot" style="background:${dt.col}"></div>
        <span class="cal-wk-evt-lbl">${ESC(e.client||dt.label)}</span>
        ${avs?`<span class="cal-wk-evt-avs">${avs}</span>`:''}
      </div>`;
    }).join('');
    const moreHtml=evts.length>maxShow?`<div class="cal-wk-more">+${evts.length-maxShow}</div>`:'';
    const emptyHtml=!evts.length?`<div class="cal-wk-empty">livre</div>`:'';

    return`<div class="cal-wk-day${isToday?' wk-today':''}${isSel?' wk-selected':''}" onclick="calSelectDay('${dk}');calJumpToMonth(${d.getFullYear()},${d.getMonth()})">
      <div class="cal-wk-day-hdr">
        <span class="cal-wk-dow">${WDAYS[i]}</span>
        <span class="cal-wk-num">${d.getDate()}</span>
        ${isToday?'<span style="font-size:9px;color:var(--acc);font-weight:600;margin-left:2px">Hoje</span>':''}
      </div>
      <div class="cal-wk-events">${evtHtml}${moreHtml}${emptyHtml}</div>
    </div>`;
  }).join('');

  return`<div class="cal-week-strip">
    <div class="cal-week-strip-hdr">
      <div class="cal-week-strip-title">
        <i class="ti ti-calendar-week" style="font-size:12px"></i>
        Semana — ${weekLabel}
      </div>
      <div class="cal-week-strip-nav">
        <button class="cal-wk-nav" onclick="event.stopPropagation();calWeekNav(-1)" title="Semana anterior"><i class="ti ti-chevron-left"></i></button>
        <button class="cal-wk-nav" onclick="event.stopPropagation();calWeekNow()" title="Semana atual" style="font-size:9px;font-weight:700;width:auto;padding:0 7px;letter-spacing:.04em">HOJ</button>
        <button class="cal-wk-nav" onclick="event.stopPropagation();calWeekNav(1)" title="Próxima semana"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div class="cal-week-days">${dayCols}</div>
  </div>`;
}

/* ═══════════════════════════════════
   FIREBASE STORAGE — FILE SYNC
   Files stored as {name, url, path} when online
   Files stored as {name, data, type}  when offline (localStorage only)
═══════════════════════════════════ */

function fbStorageAvailable(){
  return !!(window._fbStorage);
}

// Upload a File object → returns Promise<{name,url,path}>
function fbUploadFile(file, folder){
  return new Promise((resolve, reject)=>{
    if(!fbStorageAvailable()){reject(new Error('Storage not configured'));return;}
    const path=`${folder}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const ref=window._fbStorage.ref(path);
    const task=ref.put(file);
    task.then(snap=>snap.ref.getDownloadURL()).then(url=>{
      resolve({name:file.name,url,path});
    }).catch(reject);
  });
}

// Delete a file from storage by path
function fbDeleteFile(path){
  if(!fbStorageAvailable()||!path) return Promise.resolve();
  return window._fbStorage.ref(path).delete().catch(()=>{});
}

/* ── Universal upload handler ──
   Uses Storage if connected, localStorage base64 otherwise.
   onDone(fileObj) where fileObj = {name,url?,path?,data?,type?}
*/
function universalUpload(file, folder, onDone){
  if(fbStorageAvailable()){
    fbSetStatus('syncing','Enviando arquivo...');
    fbUploadFile(file, folder).then(fileObj=>{
      fbSetStatus('online','Sincronizado');
      onDone(fileObj);
    }).catch(err=>{
      console.error('Storage upload error:',err);
      fbSetStatus('offline','Erro no upload');
      alert('Erro ao enviar arquivo: '+err.message);
    });
  } else {
    // fallback: base64 local
    const r=new FileReader();
    r.onload=ev=>onDone({name:file.name,data:ev.target.result,type:file.type});
    r.readAsDataURL(file);
  }
}

// Get display URL from file object (works for both storage url and local base64)
function fileURL(f){return f?f.url||f.data||'':''}

// Multi-file upload for new diária modal
function calSaveDiaria(dateKey){
  const typeEl=document.querySelector('.dtype-opt.on');
  const type=typeEl?typeEl.dataset.type:'film';
  const client=(document.getElementById('di-client')||{}).value?.trim()||'';
  const local=(document.getElementById('di-local')||{}).value?.trim()||'';
  const notes=(document.getElementById('di-notes')||{}).value?.trim()||'';
  const assignees=[];
  document.querySelectorAll('#di-assignees .diaria-aopt.on').forEach(el=>{
    const[t,idStr]=el.dataset.key.split('-');assignees.push({type:t,id:+idStr});
  });
  const filesInp=document.getElementById('di-files');
  const fileList=filesInp?[...filesInp.files]:[];
  const entry={id:'d'+Date.now(),date:dateKey,type,client,local,notes,assignees,files:[],links:[..._calTmpLinks]};

  if(fileList.length && fbStorageAvailable()){
    // Upload all files to storage
    let pending=fileList.length;
    closeM();
    fbSetStatus('syncing',`Enviando ${pending} arquivo${pending>1?'s':''}...`);
    fileList.forEach(file=>{
      fbUploadFile(file,'diarias').then(fileObj=>{
        entry.files.push({id:'f'+Date.now()+Math.random(),...fileObj});
        pending--;
        if(pending===0){
          CAL.diarias.push(entry);calSave();
          _calSelectedDay=dateKey;demShowCalendar();
          fbSetStatus('online','Sincronizado');
        }
      }).catch(err=>{console.error(err);pending--;if(pending===0){CAL.diarias.push(entry);calSave();_calSelectedDay=dateKey;demShowCalendar();}});
    });
  } else if(fileList.length){
    // fallback base64
    let pending=fileList.length;
    fileList.forEach(file=>{
      const r=new FileReader();
      r.onload=ev=>{
        entry.files.push({id:'f'+Date.now()+Math.random(),name:file.name,data:ev.target.result,type:file.type});
        pending--;
        if(pending===0){CAL.diarias.push(entry);calSave();closeM();_calSelectedDay=dateKey;demShowCalendar();}
      };
      r.readAsDataURL(file);
    });
  } else {
    CAL.diarias.push(entry);calSave();closeM();_calSelectedDay=dateKey;demShowCalendar();
  }
}

/* ═══════════════════════════════════
   FIREBASE REALTIME SYNC
═══════════════════════════════════ */
let _fbDb   = null;
let _fbRef  = null;
let _fbOwnSave  = false;
let _fbSaveTimer = null;
let _fbConnected = false;

function fbGetConfig(){
  try{return JSON.parse(localStorage.getItem('coala-fb')||'null');}catch(e){return null;}
}

function fbSetStatus(status, label){
  const dot=document.getElementById('sync-dot');
  const lbl=document.getElementById('sync-label');
  if(dot){dot.className='sync-dot '+status;}
  if(lbl){lbl.textContent=label;}
  _fbConnected=(status==='online');
}

function fbConnect(cfg){
  try{
    // Delete previous app if exists
    if(firebase.apps.length){firebase.apps.forEach(app=>app.delete());}
    const app=firebase.initializeApp(cfg);
    _fbDb=firebase.database(app);
    _fbRef=_fbDb.ref('coala-studio');
    if(cfg.storageBucket) window._fbStorage=firebase.storage(app);
    localStorage.setItem('coala-fb',JSON.stringify({...cfg}));

    fbSetStatus('syncing','Conectando...');

    // Test connection & load initial data
    _fbRef.once('value').then(snap=>{
      fbSetStatus('online','Sincronizado');
      const data=snap.val();
      if(data){
        fbApply(data);
        renderAll();
      } else {
        fbPush(); // first time: seed data
      }
      // Real-time listener
      _fbRef.on('value', snap2=>{
        if(_fbOwnSave){_fbOwnSave=false;fbSetStatus('online','Sincronizado');return;}
        const d=snap2.val();
        if(d){fbApply(d);renderAll();}
        fbSetStatus('online','Sincronizado');
      });
    }).catch(err=>{
      console.error('Firebase connect error:',err);
      fbSetStatus('offline','Erro de conexão');
      console.error('Firebase error detail:',err);fbSetStatus('offline','Erro: '+err.code);
    });

    // Connection state monitor
    _fbDb.ref('.info/connected').on('value', snap3=>{
      if(snap3.val()===false) fbSetStatus('offline','Sem conexão');
    });

    return true;
  }catch(e){
    console.error(e);
    fbSetStatus('offline','Erro');
    return false;
  }
}

function fbPush(){
  if(!_fbRef){save();return;}
  save(); // always save locally too
  fbSetStatus('syncing','Salvando...');
  _fbOwnSave=true;
  clearTimeout(_fbSaveTimer);
  _fbSaveTimer=setTimeout(()=>{
    _fbRef.set(fbSnapshot()).catch(err=>{
      console.error('Firebase write error:',err);
      fbSetStatus('offline','Erro ao salvar');
      _fbOwnSave=false;
    });
  },700);
}

function fbSnapshot(){
  // Exclude binary files from Firebase (keep in localStorage only)
  return {
    ts: Date.now(),
    sm:S.sm, des:S.des, vm:S.vm,
    clients:S.clients,
    onboarding:S.onboarding.map(o=>({...o,file:o.file?.url?o.file:null})),
    funcionarios:S.funcionarios.map(f=>({...f,contract:f.contract?.url?f.contract:null})),
    terceirizados:Object.fromEntries(THIRD_SECS.map(s=>[s.key,(S.terceirizados[s.key]||[]).map(j=>({...j,file:j.file?.url?j.file:null}))])),
    lancamentos:S.lancamentos.map(l=>({...l,delivs:Object.fromEntries(Object.entries(l.delivs).map(([k,v])=>[k,{...v,file:v.file?.url?v.file:null}]))})),
    audiovisual:S.audiovisual.map(a=>({...a,file:a.file?.url?a.file:null})),
    fin:S.fin,
    demTasks:DEM.tasks,
    diarias:CAL.diarias.map(d=>({...d,files:(d.files||[]).map(f=>f.url?f:{...f,data:undefined}).filter(f=>f.url||f.name)})),
  };
}

function fbApply(data){
  if(!data)return;
  if(data.sm) S.sm=data.sm;
  if(data.des) S.des=data.des;
  if(data.vm) S.vm=data.vm;
  if(data.clients){
    S.clients=data.clients;
    S.clients.forEach(c=>{if(!c.status)c.status='normal';if(c.block===undefined)c.block=null;if(c.vmId===undefined)c.vmId=null;});
  }
  if(data.onboarding) S.onboarding=data.onboarding.map(o=>({...o,file:o.file||null}));
  if(data.funcionarios) S.funcionarios=data.funcionarios.map(f=>({...f,contract:f.contract||null}));
  if(data.terceirizados){
    S.terceirizados=data.terceirizados;
    THIRD_SECS.forEach(s=>{if(!S.terceirizados[s.key])S.terceirizados[s.key]=[];S.terceirizados[s.key].forEach(j=>{if(!j.file)j.file=null;});});
  }
  if(data.lancamentos){
    S.lancamentos=data.lancamentos;
    S.lancamentos.forEach(l=>DELIVERABLES.forEach(d=>{if(!l.delivs[d.key])l.delivs[d.key]={status:'pending',resp:'',deadline:'',file:null};if(!l.delivs[d.key].file)l.delivs[d.key].file=null;}));
  }
  if(data.audiovisual) S.audiovisual=data.audiovisual.map(a=>({...a,file:a.file||null}));
  if(data.fin){S.fin=data.fin;if(!S.fin[S.month])S.fin[S.month]={rec:[],avul:[],saidas:[]};}
  if(data.demTasks) DEM.tasks=data.demTasks;
  if(data.diarias) CAL.diarias=data.diarias.map(d=>({...d,files:d.files||[]}));
  syncClientsToRec();
}

/* ── Firebase Setup Modal ── */
function openFbSetup(){
  const cfg=fbGetConfig()||{};
  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" id="ov">
      <div class="fb-setup">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
          <div style="width:38px;height:38px;border-radius:10px;background:var(--coala-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="ti ti-cloud" style="color:#fff;font-size:19px"></i>
          </div>
          <div>
            <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800">Sincronização em tempo real</div>
            <div style="font-size:12px;color:var(--text3)">Conecte ao Firebase para compartilhar dados entre a equipe</div>
          </div>
        </div>

        <div class="fb-steps">
          <div class="fb-step"><div class="fb-step-num">1</div><div>Acesse <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> e clique em <strong>Criar projeto</strong> (ou use um existente)</div></div>
          <div class="fb-step"><div class="fb-step-num">2</div><div>No menu lateral, vá em <strong>Build → Realtime Database → Criar banco de dados</strong> → escolha <strong>Modo de teste</strong> → Ativar</div></div>
          <div class="fb-step"><div class="fb-step-num">3</div><div>Copie a <strong>URL do banco</strong> que aparece no topo (ex: <span style="font-family:monospace;font-size:11px;background:var(--bg);padding:1px 5px;border-radius:3px">https://projeto-default-rtdb.firebaseio.com</span>)</div></div>
          <div class="fb-step"><div class="fb-step-num">4</div><div>Em <strong>Configurações do projeto → Geral → Seus apps</strong>, clique em <strong>&lt;/&gt; Web</strong> e copie o <strong>apiKey</strong> e o <strong>storageBucket</strong></div></div>
          <div class="fb-step"><div class="fb-step-num">5</div><div>Vá em <strong>Build → Storage → Começar → Modo de teste → Ativar</strong></div></div>
          <div class="fb-step"><div class="fb-step-num">6</div><div>Cole os dados abaixo e clique em <strong>Conectar</strong>. Repita nos outros dispositivos da equipe.</div></div>
        </div>

        <div class="field"><label>Database URL</label>
          <input id="fb-url" type="text" placeholder="https://seu-projeto-default-rtdb.firebaseio.com" value="${ESC(cfg.databaseURL||'')}" />
        </div>
        <div class="field"><label>API Key</label>
          <input id="fb-key" type="text" placeholder="AIzaSy..." value="${ESC(cfg.apiKey||'')}" />
        </div>
        <div class="field"><label>Storage Bucket</label>
          <input id="fb-bucket" type="text" placeholder="seu-projeto.appspot.com" value="${ESC(cfg.storageBucket||'')}" />
          <div style="font-size:10px;color:var(--text3);margin-top:4px">Encontre em: Configurações do projeto → Geral → storageBucket (ex: <span style="font-family:monospace">coala-12345.appspot.com</span>)</div>
        </div>
        <div id="fb-feedback" style="margin-bottom:.75rem"></div>
        <div class="modal-actions">
          ${_fbConnected?'<button class="btn-g" onclick="fbDisconnect()" style="margin-right:auto;color:var(--red)"><i class="ti ti-plug-x" style="font-size:13px"></i> Desconectar</button>':''}
          <button class="btn-g" onclick="closeM()">Fechar</button>
          <button class="btn-p" onclick="fbTryConnect()" style="background:var(--coala-blue)"><i class="ti ti-plug" style="font-size:13px"></i> Conectar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM();});
  setTimeout(()=>document.getElementById('fb-url')?.focus(),50);
  document.getElementById('fb-url')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('fb-key')?.focus();});
  document.getElementById('fb-key')?.addEventListener('keydown',e=>{if(e.key==='Enter')fbTryConnect();});
}

function fbTryConnect(){
  const url=(document.getElementById('fb-url')?.value||'').trim();
  const key=(document.getElementById('fb-key')?.value||'').trim();
  const fb=document.getElementById('fb-feedback');
  if(!url||!key){if(fb)fb.innerHTML='<div class="fb-status-err"><i class="ti ti-alert-circle"></i> Preencha a URL e o API Key.</div>';return;}
  if(fb)fb.innerHTML='<div style="font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Conectando...</div>';
  const bucket=(document.getElementById('fb-bucket')?.value||'').trim();
  // Auto-derive projectId from databaseURL
  // e.g. https://studio-coala-default-rtdb.firebaseio.com → studio-coala
  let projectId='';
  try{
    const rtdbHost=url.replace('https://','').replace('http://','').split('.')[0];
    projectId=rtdbHost.replace(/-default-rtdb$/,'');
  }catch(e){}
  const authDomain=projectId?projectId+'.firebaseapp.com':'';
  const cfg={apiKey:key,databaseURL:url,storageBucket:bucket||projectId+'.appspot.com',authDomain,projectId,appId:'1:000000000000:web:000000000000'};
  const ok=fbConnect(cfg);
  if(ok){
    setTimeout(()=>{
      if(_fbConnected){
        if(fb)fb.innerHTML='<div class="fb-status-ok"><i class="ti ti-circle-check"></i> Conectado com sucesso! Os dados estão sincronizando.</div>';
        setTimeout(()=>closeM(),1800);
      } else {
        if(fb)fb.innerHTML='<div class="fb-status-err"><i class="ti ti-alert-circle"></i> Não foi possível conectar. Verifique a URL e o API Key.</div>';
      }
    },2500);
  } else {
    if(fb)fb.innerHTML='<div class="fb-status-err"><i class="ti ti-alert-circle"></i> Erro na configuração. Verifique os dados.</div>';
  }
}

function fbDisconnect(){
  if(firebase.apps.length) firebase.apps.forEach(app=>app.delete().catch(()=>{}));
  _fbDb=null;_fbRef=null;_fbConnected=false;
  localStorage.removeItem('coala-fb');
  fbSetStatus('offline','Offline');
  closeM();
}

// Auto-connect Firebase if previously configured
(function(){
  const cfg=fbGetConfig();
  if(cfg&&cfg.databaseURL&&cfg.apiKey){
    fbConnect(cfg);
  }
})();
load();
</script>
