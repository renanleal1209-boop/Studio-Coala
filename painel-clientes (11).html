<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Studio Coala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@700;800&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f7f5;--surface:#fff;--border:#ebebea;--border2:#dcdcda;
  --text:#0d0d0b;--text2:#5a5a58;--text3:#9a9a98;
  --hdr:#0a0a0a;
  /* Coala brand palette */
  --coala-green:#00E87A;--coala-pink:#E060F0;--coala-blue:#4535E8;
  --coala-green-dim:#00b35e;
  /* team badge colors */
  --sm-bg:#f0ebff;--sm-tx:#4535E8;
  --des-bg:#fff0fd;--des-tx:#b020c4;
  --vm-bg:#e6fff4;--vm-tx:#00875a;
  /* accent = Coala green */
  --acc:#00E87A;--acc-h:#00b35e;--acc-dark:#007a42;
  --green:#059669;--blue:#4535E8;--red:#e02020;
  --r:12px;--rs:8px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ═══ HEADER ═══ */
header{background:var(--hdr);position:sticky;top:0;z-index:100}
.hdr-row1{height:56px;display:flex;align-items:center;gap:1rem;padding:0 1.5rem;border-bottom:1px solid rgba(255,255,255,.06)}
.hdr-row2{height:42px;display:flex;align-items:center;gap:.875rem;padding:0 1.5rem;border-bottom:2px solid var(--coala-green);background:rgba(255,255,255,.02)}
.hdr-row2-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,232,122,.5);white-space:nowrap;flex-shrink:0;font-family:'Sora',sans-serif}
.hdr-sep{width:1px;height:18px;background:rgba(255,255,255,.1);flex-shrink:0}
.logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;flex-shrink:0;letter-spacing:-.01em}
.logo em{color:var(--coala-green);font-style:normal;font-weight:800}
.nav-tabs{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:8px;padding:3px;flex-shrink:0;flex-wrap:wrap}
.nav-tab{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s,color .15s;white-space:nowrap}
.nav-tab:hover{color:rgba(255,255,255,.75)}
.nav-tab.active{background:rgba(0,232,122,.15);color:var(--coala-green);border-bottom:2px solid var(--coala-green)}
.team-strip{display:flex;align-items:center;gap:1rem;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
.team-strip::-webkit-scrollbar{display:none}
.team-group{display:flex;align-items:center;gap:5px;flex-shrink:0}
.tg-lbl{font-size:9px;letter-spacing:.08em;color:rgba(0,232,122,.55);text-transform:uppercase;margin-right:2px;font-family:'Sora',sans-serif;font-weight:600}
.chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px}
.chip.sm {background:rgba(69,53,232,.25);color:#a5b4fc}
.chip.des{background:rgba(224,96,240,.2);color:#f0abfc}
.chip.vm {background:rgba(0,232,122,.18);color:#6effc0}
.chip-name{cursor:text;border-radius:3px;padding:1px 2px;transition:background .15s}
.chip-name:hover{background:rgba(255,255,255,.15)}
.chip-name-inp{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:4px;color:inherit;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:500;padding:1px 5px;outline:none;width:100px}
.chip-x{opacity:0;font-size:10px;cursor:pointer;transition:opacity .15s;margin-left:1px}
.chip:hover .chip-x{opacity:.7}.chip-x:hover{opacity:1!important}
.chip-add{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:rgba(0,232,122,.1);border:1px dashed rgba(0,232,122,.4);color:rgba(0,232,122,.7);cursor:pointer;font-size:11px;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.chip-add:hover{background:rgba(0,232,122,.2);color:var(--coala-green);border-color:rgba(0,232,122,.7)}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-dot.online{background:var(--coala-green);box-shadow:0 0 6px rgba(0,232,122,.6)}
.sync-dot.offline{background:#6b7280}
.sync-dot.syncing{background:#f59e0b;animation:syncPulse 1s infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.sync-label{font-size:10px;color:rgba(255,255,255,.4);font-family:'Sora',sans-serif}
.sync-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:none;color:rgba(255,255,255,.45);font-size:10px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;flex-shrink:0}
.sync-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.2)}
/* Firebase setup modal */
.fb-setup{background:var(--surface);border-radius:var(--r);padding:2rem;width:100%;max-width:540px;box-shadow:0 24px 64px rgba(0,0,0,.18);animation:slideU .2s ease;max-height:90vh;overflow-y:auto}
.fb-steps{display:flex;flex-direction:column;gap:.75rem;margin:1rem 0 1.25rem;background:var(--bg);border-radius:var(--rs);padding:1rem}
.fb-step{display:flex;gap:10px;font-size:12px;color:var(--text2);line-height:1.5}
.fb-step-num{width:20px;height:20px;border-radius:50%;background:var(--coala-blue);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.fb-step a{color:var(--coala-blue);text-decoration:none;font-weight:600}
.fb-step a:hover{text-decoration:underline}
.fb-status-ok{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--coala-green);font-weight:600;padding:8px 12px;background:#e6fff4;border-radius:var(--rs);border:1px solid rgba(0,232,122,.3)}
.fb-status-err{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--red);font-weight:600;padding:8px 12px;background:#fee2e2;border-radius:var(--rs);border:1px solid #fecaca}
.fb-code{background:#1e1e2e;color:#cdd6f4;font-family:monospace;font-size:11px;padding:8px 12px;border-radius:var(--rs);margin-top:4px;word-break:break-all;line-height:1.5}
.btn-new{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--coala-green);color:#0a0a0a;border:none;border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s,transform .12s}
.btn-new:hover{background:var(--coala-green-dim);transform:translateY(-1px)}.btn-new.hidden{display:none}

/* ═══ MAIN ═══ */
main{padding:2rem;max-width:1440px;margin:0 auto}
.tab-pane{display:none}.tab-pane.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top-bar{display:flex;align-items:baseline;gap:10px;margin-bottom:1.5rem}
.top-bar h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}
.bc{font-size:12px;background:var(--border);color:var(--text3);padding:2px 9px;border-radius:20px}
.empty-st{text-align:center;padding:3.5rem 2rem;border:1px dashed var(--border2);border-radius:var(--r);color:var(--text3)}
.empty-st i{font-size:36px;display:block;margin-bottom:12px}
.ibtn{width:28px;height:28px;border:none;background:none;color:var(--text3);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .15s,color .15s}
.ibtn:hover{background:var(--bg);color:var(--text)}
input[type=text],input[type=number],input[type=month],input[type=date],select,textarea{width:100%;padding:9px 12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--coala-green);box-shadow:0 0 0 3px rgba(0,232,122,.15)}
textarea{resize:vertical;min-height:80px;line-height:1.55}

/* ═══ CLIENTES ═══ */
.legend-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-sep{width:1px;height:14px;background:var(--border2);margin:0 4px}
.leg-blk{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.block-sec{margin-bottom:2rem}
.block-hdr{display:flex;align-items:center;gap:10px;margin-bottom:.875rem;padding-bottom:.75rem;border-bottom:2px solid var(--border)}
.blk-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.blk-badge.A{background:var(--coala-blue);color:#fff}.blk-badge.B{background:#1e40af;color:#fff}
.blk-badge.C{background:#065f46;color:#fff}.blk-badge.D{background:#6a6860;color:#fff}
.blk-badge.none{background:var(--border);color:var(--text3)}
.blk-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.blk-desc{font-size:11px;color:var(--text3)}
.blk-cnt{font-size:11px;background:var(--border);color:var(--text3);padding:2px 8px;border-radius:20px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s;animation:pop .22s ease;overflow:hidden}
.card:hover{box-shadow:0 6px 28px rgba(0,0,0,.07);border-color:var(--border2)}
.card-strip{height:4px;width:100%;flex-shrink:0;transition:background .2s}
.card-strip.normal{background:#e2e8f0}.card-strip.attention{background:#f59e0b}.card-strip.critical{background:#ef4444}
.card-inner{padding:1rem 1.125rem 1.125rem;display:flex;flex-direction:column;flex:1}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.card-name{font-size:15px;font-weight:600;flex:1;line-height:1.3;cursor:text;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background .15s}
.card-name:hover{background:#f0efe9}
.card-name-inp{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:600;border:1.5px solid var(--acc);border-radius:6px;padding:3px 7px;background:#fffdf8;color:var(--text);outline:none;flex:1;box-shadow:0 0 0 3px rgba(217,119,6,.1)}
.card-btns{display:flex;gap:2px;flex-shrink:0}
.blk-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.blk-row-lbl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.blk-pills{display:flex;gap:3px}
.bpill{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s,opacity .12s;opacity:.3}
.bpill:hover{opacity:.75;transform:scale(1.1)}.bpill.on{opacity:1;border-color:var(--text);transform:scale(1.1)}
.bpill.A{background:var(--coala-blue);color:#fff}.bpill.B{background:#1e40af;color:#fff}
.bpill.C{background:#065f46;color:#fff}.bpill.D{background:#6a6860;color:#fff}
.st-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.st-lbl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.st-dots{display:flex;gap:5px}
.sdot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.sdot:hover{transform:scale(1.2)}.sdot.on{border-color:var(--text);transform:scale(1.1)}
.sdot.normal{background:#d1d5db}.sdot.attention{background:#f59e0b}.sdot.critical{background:#ef4444}
.st-txt{font-size:10px;color:var(--text3)}.st-txt.attention{color:#b45309;font-weight:600}.st-txt.critical{color:#b91c1c;font-weight:600}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:20px;cursor:pointer;transition:filter .15s}
.badge.sm {background:var(--sm-bg);color:var(--sm-tx)}
.badge.des{background:var(--des-bg);color:var(--des-tx)}
.badge.vm {background:var(--vm-bg);color:var(--vm-tx)}
.badge.sm:hover,.badge.des:hover,.badge.vm:hover{filter:brightness(.92)}
.badge.empty{background:var(--bg);color:var(--text3);border:1px dashed var(--border2);transition:background .15s,color .15s,border-color .15s}
.badge.empty:hover{background:#fef3c7;color:var(--acc);border-color:var(--acc)}
.badge-ei{font-size:9px;opacity:0;transition:opacity .15s;margin-left:2px}
.badge:not(.empty):hover .badge-ei{opacity:.6}
.obs-block{flex:1;display:flex;flex-direction:column;min-height:60px;border-top:1px solid var(--border);padding-top:10px;margin-top:auto}
.obs{flex:1;background:var(--bg);border-left:3px solid var(--border2);border-radius:0 var(--rs) var(--rs) 0;padding:9px 11px;cursor:text;transition:border-color .15s}
.obs:hover{border-color:var(--coala-pink)}
.obs-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.obs-txt{font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.obs-add{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--text3);cursor:pointer;border-radius:var(--rs);border:1px dashed var(--border);transition:color .15s,border-color .15s}
.obs-add:hover{color:var(--coala-pink);border-color:var(--coala-pink)}
.obs-ta{flex:1;width:100%;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;line-height:1.6;color:var(--text);background:#fefcf5;border:1.5px solid var(--acc);border-radius:var(--rs);padding:9px 11px;resize:none;min-height:60px;outline:none}
.obs-hint{font-size:10px;color:var(--text3);margin-top:3px}

/* ═══ ONBOARDING ═══ */
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;align-items:start}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;animation:pop .22s ease;transition:box-shadow .2s,border-color .2s}
.ob-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07);border-color:var(--border2)}
.ob-hdr{padding:.875rem 1.125rem .75rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.ob-av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--hdr);color:#fff}
.ob-name{font-size:14px;font-weight:600;flex:1;cursor:text;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background .15s}
.ob-name:hover{background:#f0efe9}
.ob-name-inp{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;border:1.5px solid var(--acc);border-radius:6px;padding:3px 7px;background:#fffdf8;color:var(--text);outline:none;flex:1;width:100%;box-shadow:0 0 0 3px rgba(217,119,6,.1)}
.ob-prog{display:flex;align-items:center;gap:8px;margin-top:6px}
.ob-prog-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.ob-prog-fill{height:100%;border-radius:2px;background:var(--coala-green);transition:width .3s}
.ob-prog-lbl{font-size:10px;color:var(--text3);white-space:nowrap}
.ob-steps{padding:.625rem 1.125rem .875rem;display:flex;flex-direction:column;gap:1px}
.ob-step{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.ob-step:last-child{border-bottom:none}
.ob-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s;font-size:12px;color:transparent}
.ob-check.done{background:var(--coala-green);border-color:var(--coala-green);color:#0a0a0a}
.ob-step-lbl{font-size:13px;color:var(--text);flex:1;transition:color .15s,text-decoration .15s}
.ob-step.done .ob-step-lbl{color:var(--text3);text-decoration:line-through}
.ob-step-date{font-size:10px;color:var(--text3);white-space:nowrap}
.ob-step-date-inp{font-size:11px;color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;background:var(--bg);outline:none;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:border-color .15s;width:128px}
.ob-step-date-inp:focus{border-color:var(--acc)}
.ob-step-date-inp::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer}
.ob-attach{border-top:1px solid var(--border);padding:.75rem 1.125rem}
.ob-attach-lbl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.ob-file{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:7px 10px}
.ob-file i{font-size:16px;color:var(--acc);flex-shrink:0}
.ob-fname{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-fbtns{display:flex;gap:4px;flex-shrink:0}
.ob-fbtn{font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s}
.ob-fbtn.dl{background:var(--acc);color:#fff}.ob-fbtn.dl:hover{background:var(--acc-h)}
.ob-fbtn.rm{background:#fee2e2;color:var(--red)}.ob-fbtn.rm:hover{background:#fecaca}
.ob-upload{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);border:1px dashed var(--border);border-radius:var(--rs);padding:8px 10px;cursor:pointer;transition:border-color .15s,color .15s}
.ob-upload:hover{border-color:var(--acc);color:var(--acc)}.ob-upload input{display:none}
.ob-add-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:1.75rem;border:1.5px dashed var(--border2);border-radius:var(--r);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text3);background:none;cursor:pointer;transition:border-color .15s,color .15s,background .15s;width:100%}
.ob-add-btn:hover{border-color:var(--acc);color:var(--acc);background:#fef9f0}

/* ═══ AUDIOVISUAL ═══ */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;align-items:start}
.av-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;animation:pop .22s ease;transition:box-shadow .2s,border-color .2s}
.av-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07);border-color:var(--border2)}
.av-stripe{height:4px;background:linear-gradient(90deg,var(--coala-pink),var(--coala-blue))}
.av-hdr{padding:.875rem 1.125rem .75rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.av-icon{width:38px;height:38px;border-radius:10px;background:var(--vm-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.fin-add:hover{background:var(--bg);color:var(--text2)}
.fin-close{background:#0a0a0a;border:1px solid rgba(0,232,122,.2);border-radius:var(--r);padding:1.25rem 1.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.fc-l .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px}
.fc-l .mon{font-size:14px;font-weight:500;color:rgba(255,255,255,.65)}
.fc-blocks{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.fc-blk{text-align:right}
.fc-blk .lbl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px;color:rgba(255,255,255,.35)}
.fc-blk .val{font-family:'Syne',sans-serif;font-size:17px;font-weight:700}
.fc-blk .val.rec{color:#6ee7b7}.fc-blk .val.avul{color:#93c5fd}.fc-blk .val.saida{color:#fca5a5}
.fc-blk .val.pos{color:#6ee7b7}.fc-blk .val.neg{color:#fca5a5}.fc-blk .val.neu{color:rgba(255,255,255,.6)}
.fc-div{width:1px;height:36px;background:rgba(255,255,255,.08);flex-shrink:0}
.fc-total{text-align:right}
.fc-total .lbl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px;color:rgba(255,255,255,.35)}
.fc-total .val{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:#fff}
.no-months{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:13px}
.no-months i{font-size:32px;display:block;margin-bottom:10px}

/* ═══ DEMANDAS KANBAN ═══ */
.dem-toolbar{display:flex;align-items:center;gap:.75rem;padding:1rem 1.75rem .875rem;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface);flex-shrink:0}
.dem-cats{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.dem-cpill{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;background:var(--bg);transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.dem-cpill:hover{border-color:var(--border2)}
.dem-cpill.on.dall{background:var(--hdr);border-color:var(--hdr);color:#fff}
.dem-cpill.on.arte {background:#f5f3ff;border-color:#7c3aed;color:#7c3aed}
.dem-cpill.on.video{background:#fdf2f8;border-color:#be185d;color:#be185d}
.dem-cpill.on.camp {background:#fffbeb;border-color:#d97706;color:#d97706}
.dem-cpill.on.copy {background:#f0f9ff;border-color:#0369a1;color:#0369a1}
.dem-stats{display:flex;gap:6px;flex-shrink:0}
.dem-stat{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.dem-stat.do  {background:#f0eeff;color:#4535E8}
.dem-stat.late{background:#fff1f2;color:#e02020}
.dem-stat.done{background:#e6fff4;color:#00875a}
.dem-board{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding:1rem 1.75rem;flex:1;overflow:hidden;min-height:0}
.dem-col{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;min-height:0}
.dem-col-stripe{height:3px;flex-shrink:0}
.dem-col-stripe.do  {background:#2563eb}
.dem-col-stripe.late{background:#dc2626}
.dem-col-stripe.done{background:#059669}
.dem-col-hdr{padding:.75rem 1rem;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.dem-col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dem-col-dot.do  {background:#2563eb}
.dem-col-dot.late{background:#dc2626}
.dem-col-dot.done{background:#059669}
.dem-col-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;flex:1}
.dem-col-cnt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.dem-col-cnt.do  {background:#eff6ff;color:#2563eb}
.dem-col-cnt.late{background:#fff1f2;color:#dc2626}
.dem-col-cnt.done{background:#f0fdf4;color:#059669}
.dem-body{flex:1;overflow-y:auto;padding:.5rem;display:flex;flex-direction:column;gap:.5rem;min-height:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.dem-body::-webkit-scrollbar{width:3px}
.dem-body.drag-over{background:rgba(217,119,6,.05);border-radius:var(--rs)}
.dem-add{width:calc(100% - 1rem);margin:.375rem .5rem .5rem;display:flex;align-items:center;gap:6px;padding:7px 10px;background:none;border:1px dashed var(--border);border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--text3);cursor:pointer;transition:border-color .15s,color .15s,background .15s;flex-shrink:0}
.dem-add:hover{border-color:var(--acc);color:var(--acc);background:#fef9f0}
.dem-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:1.5rem;color:var(--text3);font-size:11px;text-align:center;flex:1}
.dem-empty i{font-size:24px;opacity:.35}
/* task cards */
.tcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:.625rem .75rem;cursor:grab;transition:box-shadow .18s,border-color .18s;position:relative;animation:cardPop .18s ease}
@keyframes cardPop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.08);border-color:var(--border2)}
.tcard:active{cursor:grabbing}
.tcard.dragging{opacity:.35;transform:rotate(1.5deg)}
.tc-top{display:flex;align-items:flex-start;gap:5px;margin-bottom:6px}
.tc-title{font-size:12px;font-weight:600;flex:1;line-height:1.35;color:var(--text)}
.tc-edit{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--text3);cursor:pointer;border-radius:3px;font-size:13px;flex-shrink:0;opacity:0;transition:opacity .15s,background .15s}
.tcard:hover .tc-edit{opacity:1}.tc-edit:hover{background:var(--border);color:var(--text)}
.tc-tags{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.tc-cat{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;letter-spacing:.02em}
.tc-cat.arte {background:#f5f3ff;color:#7c3aed}
.tc-cat.video{background:#fdf2f8;color:#be185d}
.tc-cat.camp {background:#fffbeb;color:#d97706}
.tc-cat.copy {background:#f0f9ff;color:#0369a1}
.tc-pri{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px}
.tc-pri.hi{background:#fee2e2;color:#dc2626}
.tc-pri.md{background:#fef3c7;color:#d97706}
.tc-pri.lo{background:#d1fae5;color:#059669}
.tc-desc{font-size:10px;color:var(--text2);line-height:1.45;margin-bottom:6px;white-space:pre-wrap;max-height:48px;overflow:hidden;position:relative}
.tc-footer{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tc-assignee{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.tc-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0}
.tc-dl{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:600;padding:2px 6px;border-radius:20px;margin-left:auto;white-space:nowrap}
.tc-dl.normal{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.tc-dl.soon  {background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.tc-dl.over  {background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.tc-actions{display:flex;gap:2px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.tc-act{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:600;padding:4px 6px;border-radius:4px;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s,color .15s;color:var(--text3);background:none}
.tc-act:hover{background:var(--border);color:var(--text)}
.tc-act.do  :hover{color:#2563eb}.tc-act.late:hover{color:#dc2626}.tc-act.done:hover{color:#059669}
.tc-act.tdel:hover{background:#fee2e2;color:#991b1b}
/* dem modal */
.dem-cat-sel{display:flex;gap:5px;flex-wrap:wrap}
.dem-copt{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);font-size:11px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text2);transition:background .15s,border-color .15s}
.dem-copt:hover{border-color:var(--border2)}
.dem-copt.on.arte {background:#f5f3ff;border-color:#7c3aed;color:#7c3aed}
.dem-copt.on.video{background:#fdf2f8;border-color:#be185d;color:#be185d}
.dem-copt.on.camp {background:#fffbeb;border-color:#d97706;color:#d97706}
.dem-copt.on.copy {background:#f0f9ff;border-color:#0369a1;color:#0369a1}
.dem-asgn{display:flex;gap:5px;flex-wrap:wrap}
.dem-aopt{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;border:1.5px solid var(--border);font-size:11px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text2);transition:background .15s,border-color .15s,color .15s}
.dem-aopt:hover{border-color:var(--border2)}.dem-aopt.on{background:var(--hdr);border-color:var(--hdr);color:#fff}
.dem-aopt-av{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#fff;flex-shrink:0}

/* ─ calendar ─ */
.cal-layout{flex:1;display:flex;overflow:hidden;min-height:0}
.cal-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cal-header{display:flex;align-items:center;gap:.75rem;padding:.875rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.cal-month-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;flex:1}
.cal-nav{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);transition:background .15s,border-color .15s;flex-shrink:0}
.cal-nav:hover{background:var(--bg);border-color:var(--border2)}
.cal-today-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .15s}
.cal-today-btn:hover{background:var(--bg)}
.cal-view-btns{display:flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:2px}
.cal-view-btn{padding:4px 10px;border-radius:5px;border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .15s,color .15s}
.cal-view-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cal-week-strip{flex-shrink:0;border-bottom:2px solid var(--border);background:var(--surface)}
.cal-week-strip-hdr{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1.25rem .375rem;border-bottom:1px solid var(--border)}
.cal-week-strip-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.cal-week-strip-nav{display:flex;gap:3px}
.cal-wk-nav{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);transition:background .12s,border-color .12s}
.cal-wk-nav:hover{background:var(--bg);border-color:var(--border2)}
.cal-week-days{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:.5rem .875rem .625rem;gap:6px}
.cal-wk-day{border-radius:var(--rs);border:1px solid var(--border);overflow:hidden;min-height:64px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.cal-wk-day:hover{border-color:var(--border2);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cal-wk-day.wk-today{border-color:var(--acc);border-width:2px}
.cal-wk-day.wk-selected{border-color:var(--acc);background:rgba(217,119,6,.04)}
.cal-wk-day-hdr{padding:4px 8px;display:flex;align-items:baseline;gap:5px;border-bottom:1px solid var(--border);background:var(--bg)}
.cal-wk-dow{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.cal-wk-num{font-size:13px;font-weight:700;color:var(--text2)}
.cal-wk-day.wk-today .cal-wk-num{color:var(--coala-green)}
.cal-wk-day.wk-today .cal-wk-dow{color:var(--coala-green)}
.cal-wk-events{padding:4px 6px;display:flex;flex-direction:column;gap:2px;flex:1}
.cal-wk-evt{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:2px 5px;border-radius:4px;line-height:1.2;overflow:hidden}
.cal-wk-evt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-wk-evt-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cal-wk-evt-avs{display:flex;flex-shrink:0}
.cal-wk-av{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4px;font-weight:700;color:#fff;border:1px solid #fff;margin-left:-2px}
.cal-wk-empty{font-size:9px;color:var(--text3);padding:2px 4px;font-style:italic}
.cal-wk-more{font-size:9px;color:var(--text3);font-weight:600;padding:1px 4px}
.cal-scroll{flex:1;overflow:auto;min-height:0}
.cal-grid-wrap{min-height:100%}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.cal-dow{text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:7px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{min-height:130px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px 6px 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .12s;position:relative}
.cal-day:nth-child(7n){border-right:none}
.cal-day:hover{background:rgba(217,119,6,.03)}
.cal-day.other-month{background:#fafaf8}
.cal-day.other-month .cal-day-num{color:var(--text3)}
.cal-day.today .cal-day-num{background:var(--acc);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-day.selected{background:rgba(217,119,6,.06)}
.cal-day-num{font-size:12px;font-weight:700;color:var(--text2);line-height:1;margin-bottom:2px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.cal-event{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;transition:filter .12s;line-height:1.2}
.cal-event:hover{filter:brightness(.92)}
.cal-event-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-event-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cal-event-avs{display:flex;gap:-2px;flex-shrink:0}
.cal-event-av{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5px;font-weight:700;color:#fff;border:1.5px solid #fff;margin-left:-3px;flex-shrink:0}
.cal-more{font-size:10px;color:var(--text3);font-weight:600;padding:1px 6px;cursor:pointer}
.cal-more:hover{color:var(--acc)}
.cal-day-add-btn{position:absolute;bottom:4px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--coala-green);color:#0a0a0a;color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;opacity:0;transition:opacity .15s}
.cal-day:hover .cal-day-add-btn{opacity:1}

/* ─ sidebar ─ */
.cal-sidebar{width:320px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);transition:width .2s;overflow:hidden}
.cal-sidebar.closed{width:0;border-left:none}
.csb-hdr{padding:.875rem 1rem .75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.csb-date{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csb-close{width:26px;height:26px;border:none;background:none;color:var(--text3);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .15s,color .15s;flex-shrink:0}
.csb-close:hover{background:var(--bg);color:var(--text)}
.csb-body{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.625rem}
.csb-empty{text-align:center;padding:2rem .5rem;color:var(--text3);font-size:12px}
.csb-empty i{font-size:26px;display:block;margin-bottom:8px;opacity:.35}
.csb-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:none;border:1.5px dashed var(--border2);border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;color:var(--text3);cursor:pointer;transition:border-color .15s,color .15s,background .15s;flex-shrink:0;margin:.25rem 0}
.csb-add:hover{border-color:var(--acc);color:var(--acc);background:#fef9f0}

/* ─ diária entry card ─ */
.di-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.di-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);border-color:var(--border2)}
.di-card-top{padding:.625rem .75rem;display:flex;align-items:flex-start;gap:8px}
.di-type-bar{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:20px}
.di-card-info{flex:1;min-width:0}
.di-client{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.2}
.di-type-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-bottom:5px}
.di-type-tag.film{background:#fdf2f8;color:#be185d}
.di-type-tag.foto{background:#eff6ff;color:#2563eb}
.di-type-tag.visit{background:#f0fdf4;color:#059669}
.di-meta-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-bottom:3px}
.di-meta-row i{font-size:12px;opacity:.6;flex-shrink:0}
.di-notes-txt{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:5px;white-space:pre-wrap}
.di-avs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.di-av-chip{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);background:var(--surface);border:1px solid var(--border);padding:2px 7px;border-radius:20px}
.di-av{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5px;font-weight:700;color:#fff;flex-shrink:0}
.di-card-btns{display:flex;gap:2px;flex-shrink:0}
/* attachments */
.di-attachments{padding:0 .75rem .625rem;display:flex;flex-direction:column;gap:4px}
.di-att-row{display:flex;align-items:center;gap:6px;padding:4px 7px;background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:11px}
.di-att-row i{color:var(--acc);font-size:13px;flex-shrink:0}
.di-att-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.di-att-link{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue);text-decoration:none;font-size:11px}
.di-att-link:hover{text-decoration:underline}
.di-att-del{font-size:12px;color:var(--text3);cursor:pointer;background:none;border:none;padding:1px;border-radius:3px;transition:color .12s}
.di-att-del:hover{color:var(--red)}

/* ─ diária add modal ─ */
.diaria-type-sel{display:flex;gap:6px;flex-wrap:wrap}
.dtype-opt{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text2);transition:background .15s,border-color .15s,color .15s}
.dtype-opt:hover{border-color:var(--border2)}
.dtype-opt.on.film{background:#fdf2f8;border-color:#be185d;color:#be185d}
.dtype-opt.on.foto{background:#eff6ff;border-color:#2563eb;color:#2563eb}
.dtype-opt.on.visit{background:#f0fdf4;border-color:#059669;color:#059669}

.dem-pcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:1.25rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.625rem;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .15s}

<script>
/* ══════ CONSTANTS ══════ */
const ACS=[
  {bg:'#dbeafe',tx:'#1e40af'},{bg:'#fce7f3',tx:'#9d174d'},
  {bg:'#fef3c7',tx:'#92400e'},{bg:'#d1fae5',tx:'#064e3b'},
  {bg:'#ede9fe',tx:'#3730a3'},{bg:'#fee2e2',tx:'#991b1b'},
  {bg:'#ecfccb',tx:'#365314'},{bg:'#e0f2fe',tx:'#075985'},
];
const FC=['#1c1c1a','#3730a3','#065f46','#92400e','#991b1b','#365314','#075985'];
const TODAY=(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;})();
const BLOCKS=[
  {key:'A',label:'Bloco A',desc:'Alta prioridade'},
  {key:'B',label:'Bloco B',desc:'Boa relevância'},
  {key:'C',label:'Bloco C',desc:'Média relevância'},
  {key:'D',label:'Bloco D',desc:'Baixa prioridade'},
  {key:null,label:'Sem bloco',desc:'Não classificado'},
];
const OB_STEPS=['Reunião inicial','Entrega Joey','KV e postagens'];
const DELIVERABLES=[
  {key:'logomarca',label:'Logomarca',       icon:'ti-circle-letter-l'},
  {key:'book',     label:'Book',            icon:'ti-book'},
  {key:'manifesto',label:'Vídeo Manifesto', icon:'ti-brand-youtube'},
  {key:'lp',       label:'Landing Page',    icon:'ti-layout-bottombar'},
  {key:'vt30',     label:'VT 30 segundos',  icon:'ti-player-play'},
  {key:'vt15',     label:'VT 15 segundos',  icon:'ti-player-play'},
];
const STAT={pending:{lbl:'Pendente',next:'progress'},progress:{lbl:'Em andamento',next:'done'},done:{lbl:'Entregue ✓',next:'pending'}};
const THIRD_SECS=[
  {key:'video',label:'Vídeos Institucionais',icon:'ti-video',cls:'video'},
  {key:'site', label:'Sites',               icon:'ti-world',cls:'site'},
  {key:'lp',   label:'Landing Pages',       icon:'ti-layout-bottombar',cls:'lp'},
  {key:'logo', label:'Logomarca',           icon:'ti-circle-letter-l',cls:'logo'},
];
const mkDelivs=()=>Object.fromEntries(DELIVERABLES.map(d=>[d.key,{status:'pending',resp:'',deadline:'',file:null}]));
const mkObSteps=()=>OB_STEPS.map((lbl,i)=>({id:i+1,label:lbl,done:false,doneAt:'',scheduledDate:''}));

/* ══════ STATE ══════ */
let S={
  tab:'clientes',month:TODAY,
  sm:[{id:1,name:'Ana Lima'},{id:2,name:'Pedro Costa'}],
  des:[{id:1,name:'Carlos Silva'},{id:2,name:'Julia Mendes'}],
  vm:[{id:1,name:'Rafael Vídeo'}],
  clients:[
    {id:1,name:'Padaria Bella',smId:1,desId:1,vmId:null,obs:'Aprovação toda quinta até 14h.',status:'normal',block:'A'},
    {id:2,name:'Clínica Saúde+',smId:2,desId:1,vmId:null,obs:'Tom sóbrio.',status:'attention',block:'B'},
    {id:3,name:'Tech Soluções',smId:1,desId:2,vmId:null,obs:'',status:'normal',block:'C'},
  ],
  onboarding:[
    {id:1,name:'Novo Cliente Teste',steps:mkObSteps(),file:null},
  ],
  funcionarios:[
    {id:1,name:'Ana Lima',role:'Social Media',salary:3500,obs:'CLT desde jan/2024.',contract:null},
    {id:2,name:'Carlos Silva',role:'Designer',salary:4200,obs:'PJ. NF até dia 5.',contract:null},
  ],
  terceirizados:{video:[{id:1,title:'Vídeo institucional X',resp:'Pedro Costa',deadline:'2026-07-15',file:null}],site:[],lp:[],logo:[]},
  lancamentos:[
    {id:1,name:'Residencial Aurora',delivs:{
      logomarca:{status:'done',resp:'Carlos Silva',deadline:'2026-04-15',file:null},
      book:{status:'progress',resp:'Carlos Silva',deadline:'2026-06-10',file:null},
      manifesto:{status:'pending',resp:'Pedro Costa',deadline:'2026-07-01',file:null},
      lp:{status:'pending',resp:'',deadline:'',file:null},
      vt30:{status:'pending',resp:'',deadline:'',file:null},
      vt15:{status:'pending',resp:'',deadline:'',file:null},
    }},
  ],
  audiovisual:[
    {id:1,name:'Padaria Bella',equip:'Sony FX3, DJI RS4, Rode VideoMic',local:'Rua das Flores, 100 - Centro',obs:'Manhã — luz natural pela janela lateral',file:null},
  ],
  fin:{[TODAY]:{rec:[],avul:[],saidas:[{id:1,desc:'Ferramentas',value:350}]}},
  modal:null,
  editCliName:null,editCliObs:null,
  editFuncField:null,
  editJobField:null,
  editLancName:null,
  editObName:null,
  editAvField:null,
};

/* ══════ UTILS ══════ */
const INI=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const NID=a=>a.length?Math.max(...a.map(x=>x.id))+1:1;
const BRL=v=>'R$\u00a0'+(isNaN(v)?0:+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const SUM=a=>a.reduce((s,r)=>s+(+r.value||0),0);
const FMT_M=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});};
const CAP=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ESC=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ══════ SYNC: clients → fin.rec ══════ */
function syncClientsToRec(){
  const md=S.fin[S.month];if(!md)return;
  // build ordered list A→D→null
  const order=['A','B','C','D',null];
  const ordered=[];
  order.forEach(blk=>S.clients.filter(c=>(c.block||null)===blk).forEach(c=>ordered.push(c)));
  // keep existing values; add missing; remove deleted
  const existing=new Map(md.rec.map(r=>[r.clientId,r]));
  md.rec=ordered.map(c=>{
    if(existing.has(c.id)){const r=existing.get(c.id);r.client=c.name;return r;}
    return{id:c.id,clientId:c.id,client:c.name,service:'',value:0};
  });
}

/* ══════ PERSISTENCE ══════ */
function save(){
  // Auto-push to Firebase after local save if connected
  if(_fbConnected){
    clearTimeout(_fbSaveTimer);
    _fbSaveTimer=setTimeout(()=>{
      _fbOwnSave=true;
      fbSetStatus('syncing','Salvando...');
      _fbRef&&_fbRef.set(fbSnapshot()).then(()=>fbSetStatus('online','Sincronizado')).catch(e=>{fbSetStatus('offline','Erro ao salvar');_fbOwnSave=false;});
    },700);
  }
  try{
    const lite={...S,
      funcionarios:S.funcionarios.map(f=>({...f,contract:null})),
      lancamentos:S.lancamentos.map(l=>({...l,delivs:Object.fromEntries(Object.entries(l.delivs).map(([k,v])=>[k,{...v,file:null}]))})),
      terceirizados:Object.fromEntries(THIRD_SECS.map(s=>[s.key,(S.terceirizados[s.key]||[]).map(j=>({...j,file:null}))])),
      audiovisual:S.audiovisual.map(a=>({...a,file:null})),
    };
    localStorage.setItem('ag9',JSON.stringify(lite));
    S.funcionarios.forEach(f=>{if(f.contract)localStorage.setItem(`ag9-ct-${f.id}`,JSON.stringify(f.contract));else localStorage.removeItem(`ag9-ct-${f.id}`);});
    THIRD_SECS.forEach(s=>(S.terceirizados[s.key]||[]).forEach(j=>{if(j.file)localStorage.setItem(`ag9-jf-${s.key}-${j.id}`,JSON.stringify(j.file));else localStorage.removeItem(`ag9-jf-${s.key}-${j.id}`);}));
    S.lancamentos.forEach(l=>DELIVERABLES.forEach(d=>{const f=l.delivs[d.key]?.file;if(f)localStorage.setItem(`ag9-lf-${l.id}-${d.key}`,JSON.stringify(f));else localStorage.removeItem(`ag9-lf-${l.id}-${d.key}`);}));
    S.audiovisual.forEach(a=>{if(a.file)localStorage.setItem(`ag9-av-${a.id}`,JSON.stringify(a.file));else localStorage.removeItem(`ag9-av-${a.id}`);});
    S.onboarding.forEach(o=>{if(o.file)localStorage.setItem(`ag9-ob-${o.id}`,JSON.stringify(o.file));else localStorage.removeItem(`ag9-ob-${o.id}`);});
  }catch(e){console.warn(e);}
}
function load(){
  try{
    const raw=localStorage.getItem('ag9');
    if(raw){
      const d=JSON.parse(raw);
      ['sm','des','vm','clients','onboarding','funcionarios','lancamentos','fin','audiovisual'].forEach(k=>{if(d[k])S[k]=d[k];});
      if(d.terceirizados)S.terceirizados=d.terceirizados;
      if(d.month)S.month=d.month;
    }
    S.funcionarios.forEach(f=>{try{const c=localStorage.getItem(`ag9-ct-${f.id}`);if(c)f.contract=JSON.parse(c);}catch(e){}});
    THIRD_SECS.forEach(s=>(S.terceirizados[s.key]||[]).forEach(j=>{try{const c=localStorage.getItem(`ag9-jf-${s.key}-${j.id}`);if(c)j.file=JSON.parse(c);}catch(e){}}));
    S.lancamentos.forEach(l=>DELIVERABLES.forEach(d=>{try{const c=localStorage.getItem(`ag9-lf-${l.id}-${d.key}`);if(c)l.delivs[d.key].file=JSON.parse(c);}catch(e){}}));
    S.audiovisual.forEach(a=>{try{const c=localStorage.getItem(`ag9-av-${a.id}`);if(c)a.file=JSON.parse(c);}catch(e){}});
    S.onboarding.forEach(o=>{if(!o.file)o.file=null;try{const c=localStorage.getItem(`ag9-ob-${o.id}`);if(c)o.file=JSON.parse(c);}catch(e){}});
  }catch(e){}
  // migrations
  if(!S.vm)S.vm=[];
  S.clients.forEach(c=>{if(!c.status)c.status='normal';if(c.block===undefined)c.block=null;if(c.vmId===undefined)c.vmId=null;});
  S.lancamentos.forEach(l=>DELIVERABLES.forEach(d=>{if(!l.delivs[d.key])l.delivs[d.key]={status:'pending',resp:'',deadline:'',file:null};}));
  if(!S.fin[S.month])S.fin[S.month]={rec:[],avul:[],saidas:[]};
  if(!S.onboarding)S.onboarding=[];
  S.onboarding.forEach(o=>{if(!o.file)o.file=null;o.steps.forEach(s=>{if(s.scheduledDate===undefined)s.scheduledDate='';});});
  if(!S.audiovisual)S.audiovisual=[];
  syncClientsToRec();
  demLoad();
  renderAll();
}
function renderAll(){renderTeam();renderClients();renderOnboarding();renderFunc();renderThird();renderLanc();renderAV();renderFin();}

function go(tab){

  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  const lbls={clientes:'Novo cliente',onboarding:'Novo cliente',funcionarios:'Novo membro',lancamentos:'Novo lançamento',audiovisual:'Novo job AV',demandas:'Nova demanda'};

/* ══════ TEAM STRIP ══════ */
function renderTeam(){
  const grp=(arr,cls,type)=>arr.map(m=>`<span class="chip ${cls}" id="chip-${type}-${m.id}">
    <span class="chip-name" onclick="editChip('${type}',${m.id})" title="Editar nome">${m.name.split(' ')[0]}</span>
    <span class="chip-x" onclick="delMember('${type}',${m.id})" title="Remover">✕</span>
  </span>`).join('');
  document.getElementById('team-strip').innerHTML=`
    <div class="team-group"><span class="tg-lbl">SM</span>
      ${grp(S.sm,'sm','sm')}
      <button class="chip-add" onclick="openM('sm')"><i class="ti ti-plus"></i> Adicionar</button>
    </div>
    <div class="team-group"><span class="tg-lbl">Design</span>
      ${grp(S.des,'des','des')}
      <button class="chip-add" onclick="openM('des')"><i class="ti ti-plus"></i> Adicionar</button>
    </div>
    <div class="team-group"><span class="tg-lbl">Vídeo</span>
      ${grp(S.vm,'vm','vm')}
      <button class="chip-add" onclick="openM('vm')"><i class="ti ti-plus"></i> Adicionar</button>
    </div>`;
}
function editChip(type,id){
  const arr=type==='sm'?S.sm:type==='des'?S.des:S.vm;
  const m=arr.find(x=>x.id===id);if(!m)return;
  const chip=document.getElementById(`chip-${type}-${id}`);if(!chip)return;
  const span=chip.querySelector('.chip-name');
  const inp=document.createElement('input');inp.className='chip-name-inp';inp.value=m.name;
  span.replaceWith(inp);inp.focus();inp.select();
  const commit=()=>{const v=inp.value.trim();if(v)m.name=v;save();renderTeam();};
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderTeam();});
}
function delMember(type,id){
  if(type==='sm'){S.sm=S.sm.filter(m=>m.id!==id);S.clients.forEach(c=>{if(c.smId===id)c.smId=null;});}
  else if(type==='des'){S.des=S.des.filter(d=>d.id!==id);S.clients.forEach(c=>{if(c.desId===id)c.desId=null;});}
  else{S.vm=S.vm.filter(v=>v.id!==id);S.clients.forEach(c=>{if(c.vmId===id)c.vmId=null;});}
  save();renderTeam();renderClients();
}

/* ══════ CLIENTES ══════ */
function renderClients(){
  const n=S.clients.length;
  document.getElementById('cli-count').textContent=n+' empresa'+(n!==1?'s':'');
  const wrap=document.getElementById('cli-grid');
  if(!n){wrap.innerHTML=`<div class="empty-st"><i class="ti ti-building-community"></i><p>Nenhum cliente cadastrado.</p></div>`;return;}
  let html='';
  BLOCKS.forEach(blk=>{
    const grp=S.clients.filter(c=>(c.block||null)===blk.key);
    if(!grp.length)return;
    html+=`<div class="block-sec">
      <div class="block-hdr">
        <div class="blk-badge ${blk.key||'none'}">${blk.key||'—'}</div>
        <div><div class="blk-title">${blk.label}</div><div class="blk-desc">${blk.desc}</div></div>
        <span class="blk-cnt">${grp.length}</span>
      </div>
      <div class="cards-grid">${grp.map(c=>buildCliCard(c)).join('')}</div>
    </div>`;
  });
  wrap.innerHTML=html;
  if(S.editCliName!==null){const el=document.getElementById(`cn-${S.editCliName}`);if(el){el.focus();el.select();}}
  if(S.editCliObs!==null){const el=document.getElementById(`co-${S.editCliObs}`);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
}
function buildCliCard(c){
  const sm=S.sm.find(m=>m.id===c.smId);const des=S.des.find(d=>d.id===c.desId);const vm=S.vm.find(v=>v.id===c.vmId);
  const ac=ACS[S.clients.indexOf(c)%ACS.length];const st=c.status||'normal';const blk=c.block||null;
  const isEN=S.editCliName===c.id;const isEO=S.editCliObs===c.id;
  const nameEl=isEN
    ?`<input class="card-name-inp" id="cn-${c.id}" value="${ESC(c.name)}" onblur="commitCliName(${c.id})" onkeydown="cliNameKey(event,${c.id})" />`
    :`<span class="card-name" onclick="S.editCliName=${c.id};S.editCliObs=null;renderClients()">${ESC(c.name)}</span>`;
  const mkB=(member,cls,icon,label)=>member
    ?`<span class="badge ${cls}" onclick="openM('editCli',${c.id})" title="Alterar responsável"><i class="ti ${icon}" style="font-size:12px"></i>${ESC(member.name)}<i class="ti ti-pencil badge-ei"></i></span>`
    :`<span class="badge empty" onclick="openM('editCli',${c.id})"><i class="ti ti-plus" style="font-size:11px"></i> ${label}</span>`;
  const stTxt=st!=='normal'?`<span class="st-txt ${st}">${st==='attention'?'Atenção':'Crítico'}</span>`:'';
  const pils=['A','B','C','D'].map(b=>`<div class="bpill ${b}${blk===b?' on':''}" onclick="setBlk(${c.id},'${b}')" title="Bloco ${b}">${b}</div>`).join('');
  const obsEl=isEO
    ?`<textarea class="obs-ta" id="co-${c.id}" onblur="commitCliObs(${c.id})" onkeydown="if(event.key==='Escape'){S.editCliObs=null;renderClients()}">${ESC(c.obs||'')}</textarea><div class="obs-hint">Esc para fechar</div>`
    :c.obs?`<div class="obs" onclick="S.editCliObs=${c.id};S.editCliName=null;renderClients()"><div class="obs-lbl">Observações</div><div class="obs-txt">${ESC(c.obs)}</div></div>`
    :`<div class="obs-add" onclick="S.editCliObs=${c.id};S.editCliName=null;renderClients()"><i class="ti ti-pencil" style="font-size:12px"></i> Adicionar observação...</div>`;
  return `<div class="card">
    <div class="card-strip ${st}"></div>
    <div class="card-inner">
      <div class="card-head">
        <div class="av" style="background:${ac.bg};color:${ac.tx}">${INI(c.name)}</div>
        ${nameEl}
        <div class="card-btns">
          <button class="ibtn" onclick="openM('editCli',${c.id})" title="Editar responsáveis"><i class="ti ti-edit"></i></button>
          <button class="ibtn" onclick="delCli(${c.id})" title="Remover"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="blk-row"><span class="blk-row-lbl">Bloco</span><div class="blk-pills">${pils}</div></div>
      <div class="st-row"><span class="st-lbl">Situação</span>
        <div class="st-dots">
          <div class="sdot normal${st==='normal'?' on':''}" onclick="setSt(${c.id},'normal')" title="Normal"></div>
          <div class="sdot attention${st==='attention'?' on':''}" onclick="setSt(${c.id},'attention')" title="Atenção"></div>
          <div class="sdot critical${st==='critical'?' on':''}" onclick="setSt(${c.id},'critical')" title="Crítico"></div>
        </div>${stTxt}
      </div>
      <div class="badges">
        ${mkB(sm,'sm','ti-device-mobile','Social media')}
        ${mkB(des,'des','ti-brush','Designer')}
        ${mkB(vm,'vm','ti-video','Videomaker')}
      </div>
      <div class="obs-block">${obsEl}</div>
    </div>
  </div>`;
}
function commitCliName(id){const inp=document.getElementById(`cn-${id}`);if(!inp)return;const v=inp.value.trim();const c=S.clients.find(x=>x.id===id);if(c&&v){c.name=v;syncClientsToRec();}S.editCliName=null;save();renderClients();}
function cliNameKey(e,id){if(e.key==='Enter'){e.preventDefault();commitCliName(id);}if(e.key==='Escape'){S.editCliName=null;renderClients();}}
function commitCliObs(id){const ta=document.getElementById(`co-${id}`);if(!ta)return;const c=S.clients.find(x=>x.id===id);if(c)c.obs=ta.value.trim();S.editCliObs=null;save();renderClients();}
function setBlk(id,b){const c=S.clients.find(x=>x.id===id);if(!c)return;c.block=c.block===b?null:b;syncClientsToRec();save();renderClients();if(S.tab==='financeiro')renderFin();}
function setSt(id,st){const c=S.clients.find(x=>x.id===id);if(c){c.status=st;save();renderClients();}}
function delCli(id){S.clients=S.clients.filter(c=>c.id!==id);syncClientsToRec();save();renderClients();}

/* ══════ ONBOARDING ══════ */
function renderOnboarding(){
  const n=S.onboarding.length;
  document.getElementById('ob-count').textContent=n+' cliente'+(n!==1?'s':'');
  const grid=document.getElementById('ob-grid');
  if(!n){grid.innerHTML=`<div class="empty-st"><i class="ti ti-rocket"></i><p>Nenhum cliente em onboarding.</p></div><button class="ob-add-btn" onclick="addOB()" style="margin-top:1rem"><i class="ti ti-plus" style="font-size:16px"></i> Novo cliente</button>`;return;}
  grid.innerHTML=S.onboarding.map(o=>buildOBCard(o)).join('')
    +`<button class="ob-add-btn" onclick="addOB()"><i class="ti ti-plus" style="font-size:16px"></i> Novo cliente</button>`;
  if(S.editObName!==null){const el=document.getElementById(`obn-${S.editObName}`);if(el){el.focus();el.select();}}
}
function buildOBCard(o){
  const total=o.steps.length;const done=o.steps.filter(s=>s.done).length;const pct=Math.round(done/total*100);
  const isEN=S.editObName===o.id;
  const nameEl=isEN
    ?`<input class="ob-name-inp" id="obn-${o.id}" value="${ESC(o.name)}" onblur="commitOBName(${o.id})" onkeydown="if(event.key==='Enter'){event.preventDefault();commitOBName(${o.id})}else if(event.key==='Escape'){S.editObName=null;renderOnboarding()}" />`
    :`<span class="ob-name" onclick="S.editObName=${o.id};renderOnboarding()">${ESC(o.name)}</span>`;
  const stepsHtml=o.steps.map(s=>`<div class="ob-step${s.done?' done':''}">
    <div class="ob-check${s.done?' done':''}" onclick="toggleObStep(${o.id},${s.id})" title="${s.done?'Desmarcar':'Concluir'}">${s.done?'✓':''}</div>
    <span class="ob-step-lbl">${ESC(s.label)}</span>
    <input class="ob-step-date-inp" type="date" value="${s.scheduledDate||''}" title="Data agendada"
      onchange="setObStepDate(${o.id},${s.id},this.value)" onblur="save()" />
    ${s.done&&s.doneAt?`<span class="ob-step-date" title="Concluído em">&check; ${s.doneAt}</span>`:''}
  </div>`).join('');
  const fileEl=o.file
    ?`<div class="ob-file"><i class="ti ti-file-text"></i><span class="ob-fname" title="${ESC(o.file.name)}">${ESC(o.file.name)}</span><div class="ob-fbtns"><button class="ob-fbtn dl" onclick="dlObFile(${o.id})">Baixar</button><button class="ob-fbtn rm" onclick="rmObFile(${o.id})">Remover</button></div></div>`
    :`<label class="ob-upload"><i class="ti ti-paperclip" style="font-size:14px"></i> Anexar documento do cliente<input type="file" onchange="upObFile(${o.id},this)" /></label>`;
  return `<div class="ob-card">
    <div class="ob-hdr">
      <div class="ob-av">${INI(o.name)}</div>
      <div style="flex:1;min-width:0">${nameEl}
        <div class="ob-prog">
          <div class="ob-prog-bar"><div class="ob-prog-fill" style="width:${pct}%"></div></div>
          <span class="ob-prog-lbl">${done}/${total} etapas</span>
        </div>
      </div>
      <div class="card-btns"><button class="ibtn" onclick="delOB(${o.id})" title="Remover"><i class="ti ti-trash"></i></button></div>
    </div>
    <div class="ob-steps">${stepsHtml}</div>
    <div class="ob-attach"><div class="ob-attach-lbl">Documentos</div>${fileEl}</div>
  </div>`;
}
function commitOBName(id){const inp=document.getElementById(`obn-${id}`);if(!inp)return;const o=S.onboarding.find(x=>x.id===id);if(o)o.name=inp.value.trim()||'Sem nome';S.editObName=null;save();renderOnboarding();}
function addOB(){const id=NID(S.onboarding);S.onboarding.push({id,name:'Novo cliente',steps:mkObSteps(),file:null});S.editObName=id;save();renderOnboarding();}
function delOB(id){S.onboarding=S.onboarding.filter(x=>x.id!==id);save();renderOnboarding();}
function toggleObStep(obId,stepId){
  const o=S.onboarding.find(x=>x.id===obId);if(!o)return;
  const s=o.steps.find(x=>x.id===stepId);if(!s)return;
  s.done=!s.done;
  s.doneAt=s.done?new Date().toLocaleDateString('pt-BR'):'';
  save();renderOnboarding();
}
function setObStepDate(obId,stepId,val){
  const o=S.onboarding.find(x=>x.id===obId);if(!o)return;
  const s=o.steps.find(x=>x.id===stepId);if(s)s.scheduledDate=val;
}




/* ══════ FUNCIONÁRIOS ══════ */
function renderFunc(){
  const n=S.funcionarios.length;
  document.getElementById('func-count').textContent=n+' funcionário'+(n!==1?'s':'');
  if(!n){document.getElementById('func-grid').innerHTML=`<div class="empty-st"><i class="ti ti-users"></i><p>Nenhum funcionário cadastrado.</p></div>`;return;}
  document.getElementById('func-grid').innerHTML=S.funcionarios.map((f,i)=>buildFuncCard(f,i)).join('');
  if(S.editFuncField){const{id,field}=S.editFuncField;const el=document.getElementById(`ff-${id}-${field}`);if(el){el.focus();if(el.select&&field!=='obs')el.select();}}
}
function buildFuncCard(f,i){
  const ef=S.editFuncField;const fc=FC[i%FC.length];const isE=field=>ef&&ef.id===f.id&&ef.field===field;
  const nameEl=isE('name')?`<input class="func-name-inp" id="ff-${f.id}-name" value="${ESC(f.name)}" onblur="commitFF(${f.id},'name')" onkeydown="ffKey(event,${f.id},'name')" />`:`<span class="func-name" onclick="startFF(${f.id},'name')">${ESC(f.name)}</span>`;
  const roleEl=isE('role')?`<input class="func-role-inp" id="ff-${f.id}-role" value="${ESC(f.role||'')}" placeholder="Cargo..." onblur="commitFF(${f.id},'role')" onkeydown="ffKey(event,${f.id},'role')" />`:`<div class="func-role" onclick="startFF(${f.id},'role')">${ESC(f.role)||'Adicionar cargo...'}</div>`;
  const salEl=isE('salary')?`<input class="func-sal-inp" id="ff-${f.id}-salary" type="number" min="0" step="0.01" value="${f.salary||''}" placeholder="0,00" onblur="commitFF(${f.id},'salary')" onkeydown="ffKey(event,${f.id},'salary')" />`:`<span class="func-sal-val" onclick="startFF(${f.id},'salary')">${f.salary?BRL(f.salary):'Clique para adicionar...'}</span>`;
  const obsEl=isE('obs')?`<textarea class="func-obs-ta" id="ff-${f.id}-obs" onblur="commitFF(${f.id},'obs')" onkeydown="if(event.key==='Escape')commitFF(${f.id},'obs')">${ESC(f.obs||'')}</textarea>`:f.obs?`<div class="func-obs" onclick="startFF(${f.id},'obs')">${ESC(f.obs)}</div>`:`<div class="func-obs-empty" onclick="startFF(${f.id},'obs')"><i class="ti ti-pencil" style="font-size:12px"></i> Adicionar observação...</div>`;
  const ctEl=f.contract?`<div class="ct-file"><i class="ti ti-file-text"></i><span class="ct-fname" title="${ESC(f.contract.name)}">${ESC(f.contract.name)}</span><div class="ct-actions"><button class="ct-btn dl" onclick="dlContract(${f.id})">Baixar</button><button class="ct-btn rm" onclick="rmContract(${f.id})">Remover</button></div></div>`:`<label class="ct-upload"><i class="ti ti-upload" style="font-size:14px"></i> Anexar contrato<input type="file" accept=".pdf,.doc,.docx" onchange="upContract(${f.id},this)" /></label>`;
  return `<div class="func-card"><div class="func-head"><div class="func-av" style="background:${fc}">${INI(f.name)}</div><div style="flex:1;min-width:0">${nameEl}${roleEl}</div><div class="card-btns"><button class="ibtn" onclick="delFunc(${f.id})"><i class="ti ti-trash"></i></button></div></div><div class="func-sal-row"><span class="func-sal-lbl">Salário</span>${salEl}</div>${obsEl}<div class="func-contract"><div class="func-ct-lbl">Contrato</div>${ctEl}</div></div>`;
}
function startFF(id,field){S.editFuncField={id,field};renderFunc();}
function commitFF(id,field){
  const el=document.getElementById(`ff-${id}-${field}`);if(!el)return;
  const f=S.funcionarios.find(x=>x.id===id);if(!f)return;
  let v=el.value;if(field==='salary')v=parseFloat(v)||0;else v=v.trim();
  if(field==='name'&&!v){S.editFuncField=null;renderFunc();return;}
  f[field]=v;S.editFuncField=null;save();renderFunc();
}
function ffKey(e,id,field){if(e.key==='Enter'){e.preventDefault();commitFF(id,field);}if(e.key==='Escape'){S.editFuncField=null;renderFunc();}}

function buildJobCard(sec,j){
  const ef=S.editJobField;const isE=f=>ef&&ef.sec===sec&&ef.id===j.id&&ef.field===f;
  let dl='';if(j.deadline){const diff=(new Date(j.deadline)-new Date())/86400000;dl=diff<0?' dl-over':diff<7?' dl-soon':'';}
  const dlDisp=j.deadline?new Date(j.deadline+'T12:00:00').toLocaleDateString('pt-BR'):'';
  const titleEl=isE('title')?`<input class="job-title-inp" id="jf-${sec}-${j.id}-title" value="${ESC(j.title)}" placeholder="Título..." onblur="commitJob('${sec}',${j.id},'title')" onkeydown="jobKey(event,'${sec}',${j.id},'title')" />`:`<div class="job-title${!j.title?' empty':''}" onclick="startJob('${sec}',${j.id},'title')">${ESC(j.title)||'Clique para nomear...'}</div>`;
  const respEl=isE('resp')?`<input class="jf-inp" id="jf-${sec}-${j.id}-resp" value="${ESC(j.resp||'')}" placeholder="Nome..." onblur="commitJob('${sec}',${j.id},'resp')" onkeydown="jobKey(event,'${sec}',${j.id},'resp')" />`:`<div class="jf-val${!j.resp?' empty':''}" onclick="startJob('${sec}',${j.id},'resp')">${ESC(j.resp)||'Sem responsável'}</div>`;
  const dlEl=isE('deadline')?`<input class="jf-inp" type="date" id="jf-${sec}-${j.id}-deadline" value="${j.deadline||''}" onblur="commitJob('${sec}',${j.id},'deadline')" onkeydown="jobKey(event,'${sec}',${j.id},'deadline')" />`:`<div class="jf-val${!j.deadline?' empty':''}${dl}" onclick="startJob('${sec}',${j.id},'deadline')">${dlDisp||'Sem prazo'}</div>`;

function finSec(type,dotCls,title,rows,hasService){
  const sub=BRL(SUM(rows));
  const rh=rows.length?rows.map(r=>hasService
    ?`<tr><td><input class="fc" type="text" value="${ESC(r.client||'')}" placeholder="Cliente" onchange="updFR('${type}',${r.id},'client',this.value)" onblur="save()" /></td><td><input class="fc" type="text" value="${ESC(r.service||'')}" placeholder="Serviço" onchange="updFR('${type}',${r.id},'service',this.value)" onblur="save()" /></td><td><input class="fc r" type="number" min="0" step="0.01" value="${r.value||''}" placeholder="0,00" oninput="updFR('${type}',${r.id},'value',parseFloat(this.value)||0);updTotals()" onblur="save()" /></td><td class="fdel-td"><button class="fdel" onclick="delFR('${type}',${r.id})"><i class="ti ti-x"></i></button></td></tr>`
    :`<tr><td><input class="fc" type="text" value="${ESC(r.desc||'')}" placeholder="Descrição" onchange="updFR('${type}',${r.id},'desc',this.value)" onblur="save()" /></td><td><input class="fc r" type="number" min="0" step="0.01" value="${r.value||''}" placeholder="0,00" oninput="updFR('${type}',${r.id},'value',parseFloat(this.value)||0);updTotals()" onblur="save()" /></td><td class="fdel-td"><button class="fdel" onclick="delFR('${type}',${r.id})"><i class="ti ti-x"></i></button></td></tr>`
  ).join(''):`<tr><td colspan="${hasService?4:3}" style="padding:13px .875rem;font-size:11px;color:var(--text3);text-align:center">Nenhum item</td></tr>`;
  const th=hasService?`<th>Cliente</th><th>Serviço</th><th class="r">Valor</th><th></th>`:`<th>Descrição</th><th class="r">Valor</th><th></th>`;
  return `<div class="fin-sec"><div class="fin-sh"><div class="fin-sh-l"><div class="fdot ${dotCls}"></div><h2>${title}</h2></div><span class="fin-sub" id="sub-${type}">${sub}</span></div><table class="fin-table"><thead><tr>${th}</tr></thead><tbody>${rh}</tbody></table><button class="fin-add" onclick="addFR('${type}','${hasService}')"><i class="ti ti-plus" style="font-size:12px"></i> Adicionar linha</button></div>`;
}

function updTotals(){
  const md=S.fin[S.month];if(!md)return;
  const rec=SUM(md.rec),avul=SUM(md.avul),saida=SUM(md.saidas),ent=rec+avul,res=ent-saida;
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('sub-rec',BRL(rec));set('sub-avul',BRL(avul));set('sub-saidas',BRL(saida));
  set('fcr',BRL(rec));set('fca',BRL(avul));set('fce',BRL(ent));set('fcs',BRL(saida));
  const el=document.getElementById('fcx');if(el){el.textContent=BRL(res);el.className='val '+(res>0?'pos':res<0?'neg':'neu');}
}

function lancRespSel(lancId, delivKey, currentResp) {
  const all = [];
  (S.sm  || []).forEach(m => all.push({name: m.name, group: 'Social Media'}));
  (S.des || []).forEach(m => all.push({name: m.name, group: 'Designer'}));
  (S.vm  || []).forEach(m => all.push({name: m.name, group: 'Videomaker'}));

  // Build options grouped
  const groups = {};
  all.forEach(m => {
    if (!groups[m.group]) groups[m.group] = [];
    groups[m.group].push(m.name);
  });

  let opts = `<option value="">— Responsável —</option>`;
  Object.entries(groups).forEach(([grp, names]) => {
    opts += `<optgroup label="${ESC(grp)}">`;
    names.forEach(name => {
      const sel = name === currentResp ? ' selected' : '';
      opts += `<option value="${ESC(name)}"${sel}>${ESC(name)}</option>`;
    });
    opts += `</optgroup>`;
  });

  return `<select class="l-sel" onchange="setLF(${lancId},'${delivKey}','resp',this.value)" onblur="save()">${opts}</select>`;
}

function buildLancCard(l){
  const total=DELIVERABLES.length;const done=DELIVERABLES.filter(d=>l.delivs[d.key]?.status==='done').length;const pct=Math.round(done/total*100);
  const isEN=S.editLancName===l.id;
  const nameEl=isEN?`<input class="lanc-name-inp" id="ln-${l.id}" value="${ESC(l.name)}" onblur="commitLN(${l.id})" onkeydown="if(event.key==='Enter'){event.preventDefault();commitLN(${l.id})}else if(event.key==='Escape'){S.editLancName=null;renderLanc()}" />`:`<span class="lanc-name" onclick="S.editLancName=${l.id};renderLanc()">${ESC(l.name)}</span>`;
  const rows=DELIVERABLES.map(d=>{
    const v=l.delivs[d.key]||{status:'pending',resp:'',deadline:'',file:null};
    let dlCls='';if(v.deadline){const diff=(new Date(v.deadline)-new Date())/86400000;dlCls=diff<0?' l-over':diff<7?' l-soon':'';}
    const fileEl=v.file?`<button class="lfbtn dl" onclick="dlLancFile(${l.id},'${d.key}')" title="${ESC(v.file.name)}"><i class="ti ti-download" style="font-size:11px"></i> Baixar</button><button class="lfbtn rm" onclick="rmLancFile(${l.id},'${d.key}')"><i class="ti ti-x" style="font-size:11px"></i></button>`:`<label class="lf-lbl"><span class="lfbtn up"><i class="ti ti-paperclip" style="font-size:11px"></i> Anexar</span><input type="file" onchange="upLancFile(${l.id},'${d.key}',this)" /></label>`;
    return `<tr class="${v.status==='done'?'done-row':''}"><td><div class="ldname"><i class="ti ${d.icon}"></i>${d.label}</div></td><td class="l-stat-cell"><button class="lstat ${v.status}" onclick="cycleStat(${l.id},'${d.key}')">${STAT[v.status].lbl}</button></td><td>${lancRespSel(l.id,d.key,v.resp)}</td><td><input class="l-inp${dlCls}" type="date" value="${v.deadline||''}" onchange="setLF(${l.id},'${d.key}','deadline',this.value)" onblur="save()" /></td><td class="l-file-cell">${fileEl}</td></tr>`;
  }).join('');
  return `<div class="lanc-card"><div class="lanc-stripe"></div><div class="lanc-hdr"><div class="lanc-icon"><i class="ti ti-building-estate"></i></div><div class="lanc-hdr-mid">${nameEl}<div class="lanc-prog-wrap"><div class="lanc-prog-bar"><div class="lanc-prog-fill" style="width:${pct}%"></div></div><span class="lanc-prog-lbl">${done}/${total} entregues</span></div></div><div class="lanc-hdr-btns"><button class="ibtn" onclick="delLanc(${l.id})" title="Remover"><i class="ti ti-trash"></i></button></div></div><table class="lanc-table"><thead><tr><th style="width:20%">Entrega</th><th class="c" style="width:17%">Status</th><th style="width:23%">Responsável</th><th style="width:18%">Deadline</th><th style="width:22%">Arquivo</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
